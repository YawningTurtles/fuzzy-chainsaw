/* ===================== export / import ===================== */
function download(filename, text, mime){
  const blob = new Blob([text], {type: mime || "text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 800);
}
function markExported(){ state.lastExport = todayStr(); save(); render(); }
function exportJSON(){
  download(`kinetic-tracker-backup-${todayStr()}.json`,
    JSON.stringify(Object.assign({}, state, { activeSession: null }), null, 2), "application/json");
  markExported();
  toast("JSON backup downloaded ✓");
}
function exportMarkdown(){
  const t = todayStr(), thisMon = mondayStr(new Date());
  let md = `# Kinetic Chain Tracker — Export ${t}\n\n`;
  md += `**Program:** ${PROGRAM.title}, spec v${PROGRAM.specVersion} (${PROGRAM.revision} revision)\n`;
  md += `**Week:** ${weeksIn()} weeks in (started ${state.program.start})\n`;
  md += `**Knee baseline:** ${baselineKnown() ? state.baseline + "/10" : "not set"}`;
  const m7 = recentPainMean(7), m28 = recentPainMean(28);
  md += ` · mean 7d ${m7==null?"—":m7} · mean 28d ${m28==null?"—":m28}`;
  md += escalationFlagged() ? ` · **ESCALATION FLAG: two weeks without improvement**\n\n` : `\n\n`;

  md += `## Current doses\n\n| Movement | Dose | Days at dose | Toward next | Criterion |\n|---|---|---|---|---|\n`;
  Object.keys(MOVEMENTS).forEach(mid=>{
    const m = MOVEMENTS[mid], p = state.progress[mid], r = rung(mid);
    const toward = m.gate.type === "none" ? "fixed" : `${p.streak}/${m.gate.need||1}${eligibleToAdvance(mid)?" — READY":""}`;
    md += `| ${m.name} | ${r.label} | ${daysAtRung(mid)} | ${toward} | ${m.gate.rule} |\n`;
  });
  const cuts = Object.keys(state.cuts).filter(m=>MOVEMENTS[m]);
  md += `\n**Half-volume queued:** ${cuts.length ? cuts.map(m=>`${MOVEMENTS[m].name} (${state.cuts[m].reason})`).join("; ") : "none"}\n\n---\n\n`;

  for (let wk = 3; wk >= 0; wk--){
    const mon = addDays(thisMon, -wk*7);
    md += `## Week of ${mon}${wk===0?" (current)":""}\n\n`;
    md += `| Date | Day | Work | Mobility | Knee 24h |\n|---|---|---|---|---|\n`;
    for (let i=0; i<7; i++){
      const date = addDays(mon, i);
      if (date > t) continue;
      const rot = rotationFor(date), d = state.days[date];
      const chk = state.painChecks.find(c=>c.date===date);
      const score = chk ? `${chk.score}/10 (vs ${chk.baseline}, ${chk.attribution})` : "—";
      const mob = d && d.mobilityComplete ? "✓" : "✗";
      let work;
      if (rot.type === "match"){
        const parts = [];
        parts.push(d && d.warmupDone ? "11+ ✓" : "11+ ✗");
        parts.push(d && d.match ? `${rot.match.format} ${d.match.minutes} min, knee ${d.match.painDuring}/10${d.match.note?` — "${d.match.note}"`:""}` : "match not logged");
        work = parts.join("; ");
      } else {
        work = rot.movements.map(spec=>{
          const m = MOVEMENTS[spec.id];
          const w = (d && d.work[spec.id]) || { sets: [], stopped:false };
          if (!w.sets.length) return `${m.short} none`;
          const detail = m.kind === "hold"
            ? w.sets.map(s=>`${s.seconds}s${s.side?s.side[0]:""}`).join(" ")
            : w.sets.map(s=>`${s.reps}@${s.rung}/RIR${s.rir}`).join(" ");
          const pain = Math.max(...w.sets.map(s=>s.pain||0));
          return `${m.short} ${w.sets.length}/${targetEntries(spec.id, spec.sets)} — ${detail}${pain?` (peak knee ${pain}/10)`:""}${w.stopped?` — STOPPED: ${w.stopReason}`:""}`;
        }).join("; ");
      }
      if (d && d.run) work += `; run ${d.run.intervals}×${d.run.runMin}/${d.run.walkMin}`;
      md += `| ${date} | ${DOW[rot.day]} · ${rot.label} | ${work} | ${mob} | ${score} |\n`;
    }
    md += `\n`;
  }

  if (state.assessments.length){
    md += `## Reassessments\n\n| Measure | ${state.assessments.map(a=>`wk ${a.weeksIn} (${a.date})`).join(" | ")} |\n`;
    md += `|---|${state.assessments.map(()=>"---").join("|")}|\n`;
    PROGRAM.measures.forEach(mm=>{
      md += `| ${mm.label} | ${state.assessments.map(a=>a.values[mm.id]!=null?a.values[mm.id]:"—").join(" | ")} |\n`;
    });
    md += `\n`;
  }
  const wblts = state.logs.filter(l=>l.type==="wblt");
  if (wblts.length){
    md += `## Archived WBLT spot checks (previous version)\n\n| Date | Left | Right | L behind R |\n|---|---|---|---|\n`;
    wblts.forEach(w=>{ md += `| ${w.date} | ${w.left} | ${w.right} | ${w.asym} |\n`; });
    md += `\n`;
  }
  if (state.legacySymptomChecks && state.legacySymptomChecks.length){
    md += `## Archived morning checks (previous 0–3 scale — a different instrument, not converted)\n\n`;
    md += `${state.legacySymptomChecks.length} entries, ${state.legacySymptomChecks[0].date} to ${state.legacySymptomChecks[state.legacySymptomChecks.length-1].date}. Full detail is in the JSON backup.\n\n`;
  }
  md += `---\n_Generated by the offline Kinetic Chain Tracker (single HTML file, localStorage only)._\n`;
  download(`kinetic-tracker-report-${t}.md`, md, "text/markdown");
  markExported();
  toast("Markdown report downloaded ✓");
}
function importJSON(input){
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch(e){ toast("That file isn't valid JSON."); return; }
    if (!data || !data.program){ toast("That doesn't look like a tracker backup."); return; }
    data = migrate(data);
    window._pendingImport = data;
    const nDays = Object.keys(data.days||{}).length;
    showModal(`<h2>Import backup</h2>
      <p>Backup contains <b>${nDays}</b> logged days and <b>${(data.painChecks||[]).length}</b> knee checks.</p>
      <p class="dim"><b>Replace</b> wipes current data and restores the backup.<br>
      <b>Merge</b> keeps everything from both and prefers the more complete record for any day present in each.</p>
      <div class="yn"><button class="warn" onclick="applyImport('replace')">Replace</button>
      <button class="primary" onclick="applyImport('merge')">Merge</button></div>
      <button class="ghost big-btn" onclick="closeModal()">Cancel</button>`);
  };
  reader.readAsText(file);
  input.value = "";
}
function applyImport(mode){
  const data = window._pendingImport; if (!data) return;
  if (mode === "replace"){
    state = Object.assign(defaultState(), data, { activeSession: null });
  } else {
    Object.entries(data.days || {}).forEach(([date, day])=>{
      const mine = state.days[date];
      if (!mine){ state.days[date] = day; return; }
      const count = o => Object.values(o.work||{}).reduce((a,w)=>a+(w.sets||[]).length,0);
      if (count(day) > count(mine)) state.days[date] = Object.assign({}, mine, day);
      const m = state.days[date];
      m.mobilityComplete = mine.mobilityComplete || day.mobilityComplete;
      m.warmupDone = mine.warmupDone || day.warmupDone;
      m.match = mine.match || day.match;
      m.run = mine.run || day.run;
    });
    const have = new Set(state.painChecks.map(c=>c.date));
    (data.painChecks||[]).forEach(c=>{ if (!have.has(c.date)) state.painChecks.push(c); });
    const haveA = new Set(state.assessments.map(a=>a.id));
    (data.assessments||[]).forEach(a=>{ if (!haveA.has(a.id)) state.assessments.push(a); });
    const haveL = new Set(state.logs.map(l=>l.id));
    (data.logs||[]).forEach(l=>{ if (!haveL.has(l.id)) state.logs.push(l); });
    // Keep whichever rung is further along, so a merge never silently de-loads.
    Object.keys(MOVEMENTS).forEach(mid=>{
      const theirs = (data.progress||{})[mid];
      if (theirs && theirs.step > state.progress[mid].step) state.progress[mid] = theirs;
    });
    if (state.baseline == null && data.baseline != null) state.baseline = data.baseline;
    if (data.lastExport && (!state.lastExport || data.lastExport > state.lastExport)) state.lastExport = data.lastExport;
  }
  state.painChecks.sort((a,b)=>a.date.localeCompare(b.date));
  state.assessments.sort((a,b)=>a.date.localeCompare(b.date));
  window._pendingImport = null;
  save(); closeModal(); render();
  toast(mode === "replace" ? "Backup restored ✓" : "Backups merged ✓");
}

/* ===================== modal + toast ===================== */
function showModal(html, blocking){
  document.getElementById("modalhost").innerHTML =
    `<div class="modal-back" ${blocking ? "" : 'onclick="if(event.target===this)closeModal()"'}><div class="modal">${html}</div></div>`;
}
function closeModal(){ document.getElementById("modalhost").innerHTML = ""; }
let toastTimer = null;
function toast(msg){
  let el = document.getElementById("toast");
  if (!el){
    el = document.createElement("div"); el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#26313f;color:#e6edf3;padding:12px 18px;border-radius:12px;z-index:300;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.5);font-size:.95rem;";
    document.body.appendChild(el);
  }
  el.textContent = msg; el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display = "none"; }, 3500);
}

/* ===================== boot ===================== */
load();
getDay(todayStr(), true);
save();
render();
if (state.activeSession) resumeSession();
else if (!baselineKnown() && Object.keys(state.days).length > 1) askBaseline();
else if (checkDue()) askCheck();
window.addEventListener("beforeunload", save);
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
