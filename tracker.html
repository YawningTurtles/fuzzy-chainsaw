function strengthSectionHTML(d, rot){
  if (!isStrengthDay(d.date)) return "";
  if (d.deferred){
    return `<div class="card">
      <div class="set-head"><h2 style="margin:0;">${esc(rot.label)}</h2>
        <span class="chip amber">deferred</span></div>
      <p class="faint" style="margin:6px 0 8px;">Floor only today. Pick this up tomorrow — it is still eligible for the week's strength count.</p>
      <button class="ghost big-btn" style="margin-top:0;" onclick="undoShortOnTime()">Actually, let's do it</button>
    </div>`;
  }
  const allDone = rot.movements.every(spec => movementComplete(d, spec.id, spec.sets));
  const started = rot.movements.some(spec => ((d.work[spec.id]||{}).sets||[]).length);
  const pairs = rot.supersets || [];
  let body = "";
  pairs.forEach((pair, i)=>{
    body += `<div class="supset">Superset ${i+1} · ${pair.map(id=>esc(MOVEMENTS[id].short)).join(" + ")}</div>`;
    pair.forEach(id=>{
      const spec = rot.movements.find(s=>s.id===id);
      if (spec) body += movementCardHTML(d, spec);
    });
  });
  const unpaired = rot.movements.filter(s => !pairs.some(p=>p.includes(s.id)));
  unpaired.forEach(spec => { body += movementCardHTML(d, spec); });

  return `${body}
    ${!started && !allDone ? `<button class="ghost big-btn" onclick="shortOnTime()">Short on time — Floor only today</button>` : ""}
    ${allDone ? `<div class="banner green"><span>✓ ${esc(rot.label)} complete.</span></div>` : ""}`;
}

function movementCardHTML(d, spec){
  const mid = spec.id, m = MOVEMENTS[mid];
  const dose = doseFor(mid, spec.sets, d.date);
  const w = d.work[mid] || { sets: [], stopped:false };
  const target = targetEntries(mid, spec.sets, d.date);
  const done = w.sets.length;
  const complete = movementComplete(d, mid, spec.sets);
  const p = state.progress[mid];

  const doseTxt = m.kind === "hold"
    ? `${dose.sets} × ${dose.hold} sec${m.perSide ? " per side" : ""}`
    : `${dose.sets} × ${dose.reps != null ? dose.reps : "max−2"}${m.perSide ? "/side" : ""}`;

  const rows = [];
  for (let i=1; i<=target; i++){
    const logged = w.sets[i-1];
    if (logged){
      const detail = m.kind === "hold"
        ? `${logged.side ? logged.side+" · " : ""}${logged.seconds} sec`
        : `${esc(logged.rung)} · ${logged.reps} reps · RIR ${logged.rir}`;
      const bad = painGated(logged.pain, logged.sharp);
      rows.push(`<div class="setblock done"><div class="set-head">
        <span>${bad ? '<span style="color:var(--red)">✕</span>' : '<span class="done-check">✓</span>'} ${m.kind==="hold"?"Hold":"Set"} ${i}</span>
        <span class="faint">${detail} · knee ${logged.pain}/10${logged.sharp?" sharp":""}</span></div></div>`);
    } else if (complete){
      rows.push(`<div class="setblock blocked"><div class="set-head"><span>${m.kind==="hold"?"Hold":"Set"} ${i}</span>
        <span class="faint">${w.stopped ? "not performed" : "—"}</span></div></div>`);
    } else if (i === done + 1){
      rows.push(m.kind === "hold" ? activeHoldHTML(mid, i, target, spec, dose) : activeSetHTML(mid, i, target, spec, dose));
    } else {
      rows.push(`<div class="setblock pending"><div class="set-head"><span>${m.kind==="hold"?"Hold":"Set"} ${i}</span>
        <span class="faint">${esc(dose.label)}</span></div></div>`);
    }
  }
  const restChip = (!complete && restFor === mid && restUntil && Date.now() < restUntil)
    ? `<span class="chip blue" id="restchip">Rest ${fmtClock((restUntil-Date.now())/1000)}</span>` : "";

  return `<div class="card ${complete?"":"accent"}">
    <div class="set-head">
      <h2 style="margin:0;">${esc(m.name)}</h2>
      ${complete ? '<span class="chip green">done</span>' : `<span class="chip">${done}/${target}</span>`}
    </div>
    <div class="loadbig" style="margin-top:8px;">${esc(dose.label)}</div>
    <div class="faint">${doseTxt} · ${esc(m.tempo)}${m.kind==="reps"?` · target RIR ${PROGRAM.rir}`:""}
      ${!dose.top ? ` · <span class="faint">${p.streak}/2 toward the next rung</span>` : ` · top of ladder`}</div>
    ${d.reentry && d.reentry.setCut ? `<div class="banner green" style="margin:10px 0 0;"><span>One fewer set today — ${d.reentry.gap}-day gap.</span></div>` : ""}
    <div class="dim" style="font-size:.92rem; margin-top:6px;">${esc(m.cue)}</div>
    ${restChip}
    ${rows.join("")}
    ${w.stopped ? `<div class="banner red" style="margin:10px 0 0;"><span>Stopped today — ${esc(w.stopReason)}.</span></div>` : ""}
    ${done ? `<button class="ghost small" style="margin-top:10px;" onclick="undoSet('${mid}')">↩ Undo last</button>` : ""}
  </div>`;
}
function painRowHTML(mid, draft){
  const btns = [0,1,2,3,4,5,6].map(v=>
    `<button class="${draft.pain===v?"sel":""} ${v>PROGRAM.painLimit?"hot":""}" onclick="setPain('${mid}',${v})">${v===6?"6+":v}</button>`).join("");
  return `<label style="margin-top:12px;">Knee pain this set — over ${PROGRAM.painLimit} stops the exercise</label>
    <div class="painrow">${btns}</div>
    <button class="sharpbtn ${draft.sharp?"on":""}" onclick="toggleSharp('${mid}')">
      ${draft.sharp ? "✕ Sharp, catching or rising" : "Sharp, catching or rising?"}</button>`;
}
function activeSetHTML(mid, i, total, spec, dose){
  const m = MOVEMENTS[mid], draft = draftFor(mid);
  const rirBtns = [0,1,2,3,4].map(v=>
    `<button class="${draft.rir===v?"sel":""} ${v===PROGRAM.rir?"target":""}" onclick="setRir('${mid}',${v})">${v===4?"4+":v}</button>`).join("");
  return `<div class="setblock">
    <div class="set-head"><span class="set-title">Set ${i} of ${total}</span>
      <span class="faint">${esc(dose.label)}</span></div>
    <div class="entrygrid">
      <div><label>Reps${m.perSide?"/side":""}</label>
        <input type="number" id="reps-${mid}" inputmode="numeric" min="0" value="${draft.reps}"></div>
      <div><label>RIR — target ${PROGRAM.rir}${draft.rir==null?' · <span style="color:var(--amber)">tap one</span>':""}</label><div class="rirrow">${rirBtns}</div></div>
    </div>
    ${painRowHTML(mid, draft)}
    <button class="primary big-btn" ${draft.rir==null?'style="opacity:.45"':""} onclick="logStrengthSet('${mid}',${spec.sets})">Log set ${i} ✓</button>
  </div>`;
}
function activeHoldHTML(mid, i, total, spec, dose){
  const m = MOVEMENTS[mid], draft = draftFor(mid);
  const side = m.perSide ? (i % 2 === 1 ? "Left" : "Right") : null;
  const live = holdState && holdState.mid === mid;
  const body = live
    ? `<div class="bigtime" id="holdclock" style="font-size:clamp(56px,17vw,96px); margin:14px 0;">${fmtClock(holdLeft())}</div>
       <button class="ghost big-btn" onclick="cancelHold()">Stop the hold</button>`
    : `${painRowHTML(mid, draft)}
       <button class="primary big-btn" onclick="startHold('${mid}'${side?`,'${side}'`:",null"},${dose.hold})">
         ▶ Start ${dose.hold} sec${side ? " — " + side.toLowerCase() : ""}</button>`;
  return `<div class="setblock">
    <div class="set-head"><span class="set-title">Hold ${i} of ${total}${side?" — "+side:""}</span>
      <span class="faint">${esc(dose.label)}</span></div>
    ${body}
  </div>`;
}

function makeupBlockHTML(d){
  if (!d.makeup) return "";
  const src = rotationFor(d.makeup.from);
  const specs = src.movements;
  const anyWork = specs.some(s => ((d.work[s.id]||{}).sets||[]).length);
  const allDone = specs.every(s => movementComplete(d, s.id, s.sets));
  return `
    <div class="makeup-head">
      <div class="nu-label">Make-up session</div>
      <h2>${DOW[src.day]} · ${esc(src.label)}</h2>
      <p class="faint" style="margin:4px 0 0;">Missed ${esc(fmtDate(d.makeup.from))}. Logged against today, so tomorrow's check attributes it to the day you actually trained.</p>
    </div>
    ${allDone ? `<div class="banner green"><span>✓ Made up — ${esc(fmtShort(d.makeup.from))} counts toward this week.</span></div>` : ""}
    ${specs.map(spec => movementCardHTML(d, spec)).join("")}
    ${!anyWork ? `<button class="ghost big-btn" onclick="cancelMakeup()">Remove this make-up</button>` : ""}`;
}
function makeupPromptHTML(d){
  if (d.makeup) return "";
  const c = makeupCandidate();
  if (!c) return "";
  return `<div class="card accent">
    <div class="set-head"><h2 style="margin:0;">Yesterday's session</h2>
      <span class="chip amber">${c.deferred ? "deferred" : "missed"}</span></div>
    <p class="faint" style="margin:4px 0 8px;">${DOW[c.rot.day]} · ${esc(c.rot.label)} — ${c.partial ? "part done, still " : "outstanding: "}${esc(c.missing.map(s=>MOVEMENTS[s.id].short).join(", "))}. Today is its only make-up slot.</p>
    <button class="primary big-btn" style="margin-top:0;" onclick="startMakeup('${c.date}')">Do it today</button>
  </div>`;
}
function morningFlowHTML(){
  return `<div class="card">
    <details><summary class="faint">Morning flow</summary>
      <ol class="tight dim" style="margin-top:8px;">${PROGRAM.morning.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
    </details>
  </div>`;
}
function toggleFlag(flag){
  const d = getDay(todayStr(), true);
  d[flag] = !d[flag];
  save(); render();
}
function resumeFromBanner(){ ensureAudio(); resumeSession(); }
function dismissNotice(){ state.program.notice = null; save(); render(); }

/* ---------- 2. WEEK ---------- */
let weekOffset = 0;
function shiftWeek(n){ weekOffset += n; render(); window.scrollTo(0,0); }
function weekHTML(){
  const mon = addDays(mondayStr(new Date()), weekOffset*7);
  const t = todayStr();
  const names = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const wk = weekStats(mon);

  const rows = names.map((nm,i)=>{
    const date = addDays(mon, i);
    const rot = rotationFor(date);
    const d = dayOrBlank(date);
    const isToday = date === t, future = date > t;
    const bits = [];

    if (isStrengthDay(date)){
      if (d.madeUpOn) bits.push(`<span class="faint">missed — made up ${esc(fmtShort(d.madeUpOn))}</span>`);
      else if (d.deferred) bits.push(`<span style="color:var(--amber)">deferred</span>`);
      else rot.movements.forEach(spec=>{
        const w = d.work[spec.id] || { sets: [], stopped:false };
        const tgt = targetEntries(spec.id, spec.sets, date);
        bits.push(`${esc(MOVEMENTS[spec.id].short)} <span class="faint">${w.sets.length}/${tgt}</span>${w.stopped?' <span style="color:var(--red)">✕</span>':""}`);
      });
    } else if (rot.type === "match"){
      bits.push(d.match ? `<span class="faint">soccer ${d.match.minutes} min · knee ${d.match.painDuring}/10</span>`
                        : `<span class="faint">soccer not logged</span>`);
    } else {
      bits.push(`<span class="faint">Floor day</span>`);
    }
    if (d.makeup) bits.push(`<span style="color:var(--blue)">+ ${esc(rotationFor(d.makeup.from).label)}</span>`);
    const nb = (d.bonusSets||[]).length;
    if (nb) bits.push(`<span class="faint">${nb} bonus</span>`);

    const chk = state.painChecks.find(c=>c.forDate===date);
    return `<div class="weekrow ${isToday?"today":""}" style="display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line);">
      <div style="width:52px; flex-shrink:0; font-weight:600; font-size:.9rem;">${nm}
        <small style="display:block; color:var(--faint); font-weight:400; font-size:.75rem;">${fmtShort(date).replace(/^\w+\s/,"")}</small></div>
      <div style="flex:1; font-size:.88rem; line-height:1.4;">${bits.join(" · ")}
        ${chk ? `<div class="faint">next morning: ${chk.score}/10</div>` : ""}</div>
      <div style="display:flex; gap:5px; flex-shrink:0; padding-top:3px;">
        <span title="Floor" style="width:11px;height:11px;border-radius:50%;${d.floorComplete?"background:var(--accent);border:1px solid var(--accent)":(future?"background:var(--panel2);border:1px solid var(--line)":"background:transparent;border:1px solid #5a2b28")}"></span>
        <span title="Session" style="width:11px;height:11px;border-radius:50%;${(isStrengthDay(date) ? strengthSessionDone(date) : (rot.type==="match" ? !!d.match : d.floorComplete))?"background:var(--accent);border:1px solid var(--accent)":(future?"background:var(--panel2);border:1px solid var(--line)":"background:transparent;border:1px solid #5a2b28")}"></span>
      </div>
    </div>`;
  }).join("");

  return `<h1>Week</h1>
    <div class="row" style="margin-bottom:10px;">
      <button class="ghost small" onclick="shiftWeek(-1)">← Prev</button>
      <button class="ghost small" onclick="weekOffset=0; render();">${weekOffset===0?"This week":"Back to now"}</button>
      <button class="ghost small" onclick="shiftWeek(1)" ${weekOffset>=0?"disabled":""}>Next →</button>
    </div>
    <div class="card ${wk.win?"accent":""}">
      <div class="set-head"><h2 style="margin:0;">Week of ${fmtShort(mon)}</h2>
        ${wk.win ? '<span class="chip green">win ✓</span>' : (wk.complete ? '<span class="chip">no win</span>' : '<span class="chip">in progress</span>')}</div>
      <div class="winrow">
        <div class="winstat"><b class="${wk.floor>=PROGRAM.win.floorDays?"hit":""}">${wk.floor}/7</b><span>Floor</span></div>
        <div class="winstat"><b class="${wk.strength>=PROGRAM.win.strengthSessions?"hit":""}">${wk.strength}/${wk.slots}</b><span>Strength</span></div>
      </div>
      <p class="faint" style="margin:8px 0 2px;">Dots: Floor / session done.</p>
      ${rows}
    </div>
    <div class="card">
      <h3>The block</h3>
      <p class="faint" style="margin:2px 0;">${esc(PROGRAM.programVersion)} · ${esc(fmtShort(PROGRAM.blockStart))} to ${esc(fmtShort(PROGRAM.blockEnd))} · ${winWeeksTotal()} win weeks so far of ${PROGRAM.blockWeeks}.</p>
      <p class="faint" style="margin:6px 0 0;">Mon Strength A · Tue Floor · Wed soccer · Thu Strength B · Fri Floor · Sat Strength C · Sun Floor.</p>
    </div>`;
}

/* ---------- 3. PROGRESS ---------- */
function progHTML(){
  const live = Object.keys(MOVEMENTS).filter(mid => !MOVEMENTS[mid].retired && !MOVEMENTS[mid].bonus);
  const cards = live.map(mid=>{
    const m = MOVEMENTS[mid], p = state.progress[mid], r = rung(mid);
    const ready = eligibleToAdvance(mid);
    const waiting = waitingFor(mid);
    const ladder = m.ladder.map((L,i)=>
      `<tr><td>${i===r.i?"▶ ":""}<b style="${i===r.i?"color:var(--accent)":""}">${esc(L.label)}</b></td>
       <td class="num"><button class="ghost small" onclick="stepTo('${mid}',${i})">${i===r.i?"current":"set"}</button></td></tr>`).join("");
    return `<div class="card">
      <div class="set-head"><h2 style="margin:0;">${esc(m.name)}</h2>
        ${ready ? '<span class="chip green">ready</span>'
          : r.top ? '<span class="chip">top</span>'
          : `<span class="chip">${p.streak}/2</span>`}</div>
      <div class="loadbig" style="margin-top:8px;">${esc(r.label)}</div>
      <p class="faint" style="margin:4px 0 0;">${daysBetween(p.since, todayStr())} days at this rung${m.kneeCheck?" · knee-tracking checked on advance":""}</p>
      ${waiting.length ? `<div class="banner blue" style="margin:10px 0 0;"><span>⏳ ${waiting.length} session${waiting.length>1?"s":""} waiting on a 24-hour check.</span>
        <button onclick="backfillCheck('${waiting[0]}')">Log it</button></div>` : ""}
      <table style="margin-top:10px;">${ladder}</table>
      ${ready ? `<button class="primary big-btn" onclick="offerAdvance('${mid}')">Move up a rung</button>` : ""}
      ${p.history.length ? `<p class="faint" style="margin:8px 0 0;">Last change ${esc(fmtShort(p.history[p.history.length-1].date))}: ${esc(p.history[p.history.length-1].from)} → ${esc(p.history[p.history.length-1].to)}${p.history[p.history.length-1].drop?" (drop)":""}</p>` : ""}
    </div>`;
  }).join("");

  const checks = [...state.painChecks].sort((a,b)=>b.forDate.localeCompare(a.forDate)).slice(0,14);
  const bonusCards = ["pullup_bonus","pushup_bonus"].map(mid=>{
    const m = MOVEMENTS[mid], dose = bonusDose(mid);
    return `<div class="card">
      <div class="set-head"><h2 style="margin:0;font-size:1.05rem;">${esc(m.name)}</h2>
        <span class="chip">${bonusWeekCount(mid)} this week</span></div>
      <p class="faint" style="margin:4px 0 0;">${esc(dose.label)}${dose.reps!=null?` — ${dose.reps} reps per set`:" — needs a max test"}</p>
      <p class="faint" style="margin:4px 0 0;">Moves only at an assessment, never on a session streak.</p>
    </div>`;
  }).join("");

  return `<h1>Progress</h1>
    <div class="card">
      <div class="set-head"><h2 style="margin:0;">How a rung moves</h2></div>
      <ul class="tight dim" style="font-size:.92rem;">
        <li><b>Up</b> — all sets at RIR ${PROGRAM.rir} or easier, two sessions running, each followed by a morning check of ${PROGRAM.advancePainMax} or less.</li>
        <li><b>Hold</b> — any set below RIR ${PROGRAM.rir}, or reps missed.</li>
        <li><b>Down</b> — a morning check of ${PROGRAM.dropPainMin}+, or any set logged sharp.</li>
      </ul>
    </div>
    ${cards}
    <h3 style="margin-top:18px;">Bonus sets</h3>
    ${bonusCards}
    <div class="card">
      <h2>Knee, last 14 checks</h2>
      ${checks.length ? `<div class="tablewrap"><table>
        <tr><th>Morning after</th><th class="num">0–10</th><th>Attributed to</th></tr>
        ${checks.map(c=>`<tr><td>${esc(fmtShort(c.forDate))}</td>
          <td class="num" style="color:${c.score>=PROGRAM.dropPainMin?"var(--red)":(c.score<=PROGRAM.advancePainMax?"var(--accent)":"var(--amber)")}">${c.score}</td>
          <td>${esc(c.attribution)}</td></tr>`).join("")}
      </table></div>` : '<p class="faint">No checks logged yet.</p>'}
    </div>
    <div class="card">
      <div class="set-head"><h2 style="margin:0;">Assessments</h2>
        <span class="chip">${nextAssessDate() ? "next " + esc(fmtShort(nextAssessDate())) : "block complete"}</span></div>
      <button class="${assessDue()?"primary":"ghost"} big-btn" style="margin-top:6px;" onclick="showModal(assessFormHTML())">
        ${assessDue() ? "Do the assessment" : "Record an assessment"}</button>
      ${state.assessments.length ? `<div class="tablewrap"><table>
        <tr><th>Measure</th>${state.assessments.slice(-4).map(a=>`<th class="num">${esc(fmtShort(a.date))}</th>`).join("")}</tr>
        ${PROGRAM.measures.map(mm=>`<tr><td>${esc(mm.label)}</td>${state.assessments.slice(-4).map(a=>
          `<td class="num">${a.values[mm.id]!=null?esc(String(a.values[mm.id])):"—"}</td>`).join("")}</tr>`).join("")}
      </table></div>
      ${(()=>{ const last = state.assessments[state.assessments.length-1];
         const f = assessFlags(last.values||{});
         return f.length ? `<div class="banner amber" style="margin-top:10px;"><span>⚠️ ${f.map(esc).join(" ")}</span></div>` : ""; })()}`
      : `<p class="faint" style="margin-top:8px;">Nothing recorded yet.</p>`}
    </div>
    <div class="card">
      <h2>Stop and see a clinician</h2>
      <ul class="tight dim">${PROGRAM.pain.redFlags.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
    </div>`;
}

/* ---------- 4. DATA ---------- */
function dataHTML(){
  const dates = Object.keys(state.days).sort();
  const logged = Object.values(state.days).filter(x =>
    Object.keys(x.work||{}).length || x.floorComplete || x.match || (x.bonusSets||[]).length).length;
  const seeded = state.assessments.some(a => a.source === PROGRAM.seedAssessment.source);
  return `<h1>Data & backup</h1>
    <div class="banner amber"><span>⚠️ All your data lives in <b>this browser on this device</b>. Clearing browsing data deletes it.</span></div>
    <div class="card">
      <h2>Export</h2>
      <button class="primary big-btn" onclick="exportMarkdown()">⬇ Export Markdown (last 4 weeks)</button>
      <button class="big-btn" onclick="exportJSON()">⬇ Export JSON backup</button>
      <p class="faint" style="margin-top:8px;">Last export: ${state.lastExport ? esc(fmtDate(state.lastExport)) : "never"}</p>
    </div>
    <div class="card">
      <h2>This device</h2>
      <table>
        <tr><th>Days with logged work</th><td class="num">${logged}</td></tr>
        <tr><th>Range</th><td class="num">${dates.length ? esc(fmtShort(dates[0])) + " – " + esc(fmtShort(dates[dates.length-1])) : "—"}</td></tr>
        <tr><th>24-hour checks</th><td class="num">${state.painChecks.length}</td></tr>
        <tr><th>Win weeks</th><td class="num">${winWeeksTotal()} / ${PROGRAM.blockWeeks}</td></tr>
        <tr><th>Build</th><td class="num">${esc(PROGRAM.build)}</td></tr>
      </table>
    </div>
    <div class="card">
      <h2>Import</h2>
      <input type="file" id="importfile" accept=".json,application/json" onchange="importJSON(this)">
    </div>
    ${state.preBlockSnapshot ? `<div class="card">
      <h2>Before this block</h2>
      <p class="faint" style="margin:4px 0 8px;">Your save as it stood on ${esc(fmtDate(state.preBlockSnapshot.savedAt))}, before the Winter block migration rewrote it. Kept in case anything here looks wrong.</p>
      <button class="ghost big-btn" style="margin-top:0;" onclick="exportPreBlock()">⬇ Download the pre-block snapshot</button>
    </div>` : ""}
    ${seeded ? `<div class="card">
      <h2>Seeded baseline</h2>
      <p class="faint" style="margin:4px 0 8px;">The 31 Oct measurements from the v3 handoff were added so the first assessment has something to move against. They were not measured in this app.</p>
      <button class="ghost big-btn" style="margin-top:0;" onclick="deleteSeededAssessment()">Remove them</button>
    </div>` : ""}
    <div class="card">
      <h2>Settings</h2>
      <label style="display:flex; align-items:center; gap:10px; font-size:1rem; color:var(--text);">
        <input type="checkbox" style="width:auto; min-height:auto;" ${state.settings.sound?"checked":""}
          onchange="state.settings.sound=this.checked; save();"> Sound cues</label>
      <label style="display:flex; align-items:center; gap:10px; font-size:1rem; color:var(--text);">
        <input type="checkbox" style="width:auto; min-height:auto;" ${state.settings.vibrate?"checked":""}
          onchange="state.settings.vibrate=this.checked; save();"> Vibration</label>
      <button class="ghost big-btn" onclick="askPushupMax()">Retest the max tests</button>
    </div>
    <div class="card">
      <h2>About</h2>
      <p class="faint">${esc(PROGRAM.title)} ${esc(PROGRAM.programVersion)} · app spec v${PROGRAM.specVersion} · build ${esc(PROGRAM.build)} ·
      single offline file · no network requests · no accounts.
      ${state.cutsClearedOnMigration && state.cutsClearedOnMigration.length
        ? `<br><br>Migrating cleared ${state.cutsClearedOnMigration.length} load cut${state.cutsClearedOnMigration.length>1?"s":""} left by the previous block. The re-entry rule keeps the weight and trims a set instead.` : ""}</p>
    </div>`;
}

/* ===================== export / import ===================== */
function download(filename, text, mime){
  const blob = new Blob([text], {type: mime || "text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 800);
}
function markExported(){ state.lastExport = todayStr(); save(); render(); }
function exportPreBlock(){
  if (!state.preBlockSnapshot) return;
  download(`kinetic-tracker-preblock-v${state.preBlockSnapshot.fromVersion}-${state.preBlockSnapshot.savedAt}.json`,
    JSON.stringify(state.preBlockSnapshot.data, null, 2), "application/json");
  toast("Pre-block snapshot downloaded ✓");
}
function exportJSON(){
  download(`kinetic-tracker-backup-${todayStr()}.json`,
    JSON.stringify(Object.assign({}, state, { activeSession: null }), null, 2), "application/json");
  markExported();
  toast("JSON backup downloaded ✓");
}
function exportMarkdown(){
  const t = todayStr(), thisMon = mondayStr(new Date());
  let md = `# Kinetic Chain Tracker — Export ${t}\n\n`;
  md += `**Program:** ${PROGRAM.title} ${PROGRAM.programVersion} (app spec v${PROGRAM.specVersion})\n`;
  md += `**Block:** ${PROGRAM.blockStart} to ${PROGRAM.blockEnd}, week ${blockWeek()} of ${PROGRAM.blockWeeks}\n`;
  md += `**Win weeks:** ${winWeeksTotal()} of ${PROGRAM.blockWeeks} · current streak ${winStreak()}\n\n`;

  md += `## Current rungs\n\n| Movement | Rung | Days at rung | Toward next |\n|---|---|---|---|\n`;
  Object.keys(MOVEMENTS).filter(m=>!MOVEMENTS[m].retired).forEach(mid=>{
    const m = MOVEMENTS[mid], p = state.progress[mid], r = rung(mid);
    const toward = m.bonus ? "assessment-driven"
      : (eligibleToAdvance(mid) ? "READY" : `${p.streak}/2${waitingFor(mid).length?" (waiting on a check)":""}`);
    md += `| ${m.name} | ${r.label} | ${daysBetween(p.since, todayStr())} | ${toward} |\n`;
  });
  md += `\n---\n\n`;

  for (let wk = 3; wk >= 0; wk--){
    const mon = addDays(thisMon, -wk*7);
    const s = weekStats(mon);
    md += `## Week of ${mon} — Floor ${s.floor}/7, strength ${s.strength}/${s.slots} ${s.win ? "**WIN**" : ""}\n\n`;
    md += `| Date | Day | Work | Floor | Bonus | Next morning |\n|---|---|---|---|---|---|\n`;
    for (let i=0; i<7; i++){
      const date = addDays(mon, i);
      if (date > t) continue;
      const rot = rotationFor(date), d = state.days[date];
      const chk = state.painChecks.find(c=>c.forDate===date);
      const floor = d && d.floorComplete ? "✓" : "✗";
      const bonus = d && (d.bonusSets||[]).length
        ? ["pullup_bonus","pushup_bonus"].map(b=>{
            const n = (d.bonusSets||[]).filter(x=>x.movement===b).length;
            return n ? `${MOVEMENTS[b].short} ×${n}` : null; }).filter(Boolean).join(", ")
        : "—";
      let work;
      if (d && d.madeUpOn) work = `missed — made up ${d.madeUpOn}`;
      else if (d && d.deferred) work = `deferred (Short on time)`;
      else if (rot.type === "match") work = d && d.match ? `soccer ${d.match.minutes} min, knee ${d.match.painDuring}/10` : "soccer not logged";
      else if (!isStrengthDay(date)) work = "floor day";
      else work = rot.movements.map(spec=>{
        const m = MOVEMENTS[spec.id];
        const w = (d && d.work[spec.id]) || { sets: [] };
        if (!w.sets.length) return `${m.short} none`;
        const detail = m.kind === "hold"
          ? w.sets.map(s=>`${s.seconds}s`).join(" ")
          : w.sets.map(s=>`${s.reps}@${s.rung}/RIR${s.rir}`).join(" ");
        return `${m.short} ${w.sets.length}/${targetEntries(spec.id, spec.sets, date)} — ${detail}${w.stopped?" STOPPED":""}`;
      }).join("; ");
      if (d && d.makeup) work += `; MAKE-UP of ${d.makeup.from}`;
      if (d && d.reentry) work += `; re-entry after ${d.reentry.gap}d`;
      md += `| ${date} | ${DOW[rot.day]} | ${work} | ${floor} | ${bonus} | ${chk ? chk.score+"/10" : "—"} |\n`;
    }
    md += `\n`;
  }
  if (state.assessments.length){
    md += `## Assessments\n\n| Measure | ${state.assessments.map(a=>a.date).join(" | ")} |\n`;
    md += `|---|${state.assessments.map(()=>"---").join("|")}|\n`;
    PROGRAM.measures.forEach(mm=>{
      md += `| ${mm.label} | ${state.assessments.map(a=>a.values[mm.id]!=null?a.values[mm.id]:"—").join(" | ")} |\n`;
    });
    md += `\n`;
  }
  md += `---\n_Generated by the offline Kinetic Chain Tracker._\n`;
  download(`kinetic-tracker-report-${t}.md`, md, "text/markdown");
  markExported();
  toast("Markdown report downloaded ✓");
}
function importJSON(input){
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch(e){ toast("That file isn't valid JSON."); return; }
    if (!data || !data.program){ toast("That doesn't look like a tracker backup."); return; }
    data = migrate(data);
    window._pendingImport = data;
    showModal(`<h2>Import backup</h2>
      <p>Backup holds <b>${Object.keys(data.days||{}).length}</b> days and <b>${(data.painChecks||[]).length}</b> checks.</p>
      <div class="yn"><button class="warn" onclick="applyImport('replace')">Replace</button>
      <button class="primary" onclick="applyImport('merge')">Merge</button></div>
      <button class="ghost big-btn" onclick="closeModal()">Cancel</button>`);
  };
  reader.readAsText(file);
  input.value = "";
}
function applyImport(mode){
  const data = window._pendingImport; if (!data) return;
  if (mode === "replace"){
    state = Object.assign(defaultState(), data, { activeSession: null });
  } else {
    Object.entries(data.days || {}).forEach(([date, day])=>{
      const mine = state.days[date];
      if (!mine){ state.days[date] = day; return; }
      const count = o => Object.values(o.work||{}).reduce((a,w)=>a+(w.sets||[]).length,0);
      if (count(day) > count(mine)) state.days[date] = Object.assign({}, mine, day);
      const m2 = state.days[date];
      m2.floorComplete = mine.floorComplete || day.floorComplete;
      m2.match = mine.match || day.match;
      m2.bonusSets = (mine.bonusSets||[]).length >= (day.bonusSets||[]).length ? mine.bonusSets : day.bonusSets;
    });
    const have = new Set(state.painChecks.map(c=>c.forDate));
    (data.painChecks||[]).forEach(c=>{ if (!have.has(c.forDate)) state.painChecks.push(c); });
    const haveA = new Set(state.assessments.map(a=>a.date));
    (data.assessments||[]).forEach(a=>{ if (!haveA.has(a.date)) state.assessments.push(a); });
    Object.keys(MOVEMENTS).forEach(mid=>{
      const theirs = (data.progress||{})[mid];
      if (theirs && theirs.step > state.progress[mid].step) state.progress[mid] = theirs;
    });
  }
  state.painChecks.sort((a,b)=>a.forDate.localeCompare(b.forDate));
  state.assessments.sort((a,b)=>a.date.localeCompare(b.date));
  window._pendingImport = null;
  recomputeStreaks(); save(); closeModal(); render();
  toast(mode === "replace" ? "Backup restored ✓" : "Backups merged ✓");
}

/* ===================== modal + toast ===================== */
function showModal(html, blocking){
  document.getElementById("modalhost").innerHTML =
    `<div class="modal-back" ${blocking ? "" : 'onclick="if(event.target===this)closeModal()"'}><div class="modal">${html}</div></div>`;
}
function closeModal(){ document.getElementById("modalhost").innerHTML = ""; }
let toastTimer = null;
function toast(msg){
  let el = document.getElementById("toast");
  if (!el){
    el = document.createElement("div"); el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#26313f;color:#e6edf3;padding:12px 18px;border-radius:12px;z-index:300;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.5);font-size:.95rem;";
    document.body.appendChild(el);
  }
  el.textContent = msg; el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display = "none"; }, 3500);
}

/* ===================== boot ===================== */
load();
getDay(todayStr(), true);
applyReentry(todayStr());
recomputeStreaks();
save();
render();
if (state.activeSession) resumeSession();
else if (state.needPushupMax) askPushupMax();
else if (checkDue()) askCheck();
window.addEventListener("beforeunload", save);
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  /* Reload once when a new worker takes over, so an installed Home Screen app
     lands on a new build in the same launch. Never mid-session. */
  const bootedAt = Date.now();
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloaded || !hadController) return;
    if (state && state.activeSession) return;
    if (Date.now() - bootedAt > 10000) return;
    reloaded = true;
    location.reload();
  });
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
