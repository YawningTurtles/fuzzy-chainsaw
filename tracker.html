<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KC Tracker">
<title>Kinetic Chain Tracker</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2b3442;
  --text:#e6edf3; --dim:#9aa7b4; --faint:#6b7683;
  --accent:#4cc38a; --accent-dim:#1f5c40; --blue:#58a6ff; --amber:#e3b341; --red:#f47067;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.45; min-height:100%;}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom));}
h1,h2,h3{margin:.2em 0 .4em; line-height:1.2;}
h1{font-size:1.35rem;} h2{font-size:1.15rem;} h3{font-size:1rem;color:var(--dim);}
button{font:inherit; cursor:pointer; border:none; border-radius:var(--radius);
  background:var(--panel2); color:var(--text); padding:14px 18px; min-height:56px;}
button:active{transform:scale(.985); filter:brightness(1.15);}
button.primary{background:var(--accent); color:#06170f; font-weight:700; font-size:1.1rem;}
button.warn{background:var(--red); color:#1a0605; font-weight:700;}
button.ghost{background:transparent; border:1px solid var(--line); color:var(--dim);}
button.small{min-height:44px; padding:8px 14px; font-size:.95rem;}
button:disabled{opacity:.4;}
input,select,textarea{font:inherit; background:var(--panel2); color:var(--text);
  border:1px solid var(--line); border-radius:10px; padding:12px; min-height:52px; width:100%;}
input[type=number]{font-size:1.3rem; text-align:center; font-variant-numeric:tabular-nums;}
input[type=time]{font-size:1.1rem; text-align:center;}
textarea{min-height:80px;}
label{display:block; font-size:.9rem; color:var(--dim); margin:10px 0 4px;}
.wrap{max-width:640px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 14px 8px;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; margin-bottom:12px;}
.card.accent{border-color:var(--accent-dim);}
.card.muted{opacity:.55;}
.banner{border-radius:var(--radius); padding:12px 14px; margin-bottom:12px; font-size:.95rem;
  display:flex; gap:10px; align-items:flex-start;}
.banner.amber{background:#2b230d; border:1px solid #5c4a17; color:#ecd390;}
.banner.red{background:#2c1210; border:1px solid #6b2a25; color:#f5b3ad;}
.banner.green{background:#0f2a1d; border:1px solid var(--accent-dim); color:#a9e6c8;}
.banner button{min-height:40px; padding:6px 12px; font-size:.9rem; flex-shrink:0;}
.row{display:flex; gap:10px;}
.row>*{flex:1;}
.chip{display:inline-block; background:var(--panel2); border:1px solid var(--line);
  border-radius:999px; padding:3px 12px; font-size:.85rem; color:var(--dim);}
.chip.green{color:var(--accent); border-color:var(--accent-dim);}
.chip.red{color:var(--red); border-color:#6b2a25;}
.chip.amber{color:var(--amber); border-color:#5c4a17;}
.chip.blue{color:var(--blue); border-color:#1f3f6b;}
.dim{color:var(--dim);} .faint{color:var(--faint); font-size:.85rem;}
.big-btn{width:100%; margin-top:10px;}
.nav{position:fixed; bottom:0; left:0; right:0; background:rgba(13,17,23,.96);
  border-top:1px solid var(--line); display:flex; z-index:50;
  padding-bottom:env(safe-area-inset-bottom); backdrop-filter:blur(8px);}
.nav button{flex:1; background:none; border-radius:0; min-height:64px; color:var(--faint);
  font-size:.8rem; display:flex; flex-direction:column; gap:2px; align-items:center; justify-content:center;}
.nav button .ico{font-size:1.35rem;}
.nav button.active{color:var(--accent);}
table{width:100%; border-collapse:collapse; font-size:.92rem; margin:8px 0;}
th,td{text-align:left; padding:7px 8px; border-bottom:1px solid var(--line);}
th{color:var(--dim); font-weight:600; font-size:.82rem; text-transform:uppercase; letter-spacing:.04em;}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums;}
.tablewrap{overflow-x:auto;}
/* ===== set entry ===== */
.setblock{border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin:10px 0;
  background:var(--panel2);}
.setblock.done{background:transparent; border-style:dashed; padding:10px 14px;}
.setblock.pending{opacity:.45;}
.setblock.blocked{opacity:.35;}
.set-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap;}
.set-head>.chip{flex-shrink:0; align-self:center;}
.set-head>h2{flex:1 1 60%; min-width:0;}
.set-title{font-weight:700; font-size:1.05rem;}
.entrygrid{display:grid; grid-template-columns:92px 1fr; gap:10px; margin-top:10px; align-items:end;}
.entrygrid label{margin-top:0; white-space:nowrap;}
.loadtable th,.loadtable td{padding:6px 4px; font-size:.88rem;}
.gate{display:flex; gap:10px; margin:12px 0 4px;}
.gate button{flex:1; min-height:66px; font-size:1rem; font-weight:700; line-height:1.2;
  border:2px solid var(--line); background:var(--panel);}
.gate button.selpass{background:var(--accent); color:#06170f; border-color:var(--accent);}
.gate button.selfail{background:var(--red); color:#1a0605; border-color:var(--red);}
.rirrow{display:flex; gap:8px; margin-top:4px;}
.rirrow button{flex:1; min-height:54px; font-weight:700; border:1px solid var(--line);}
.rirrow button.sel{background:var(--blue); color:#04121f; border-color:var(--blue);}
.rirrow button.target{border-color:var(--blue);}
.loadbig{font-size:1.9rem; font-weight:800; color:var(--accent); line-height:1.1;}
/* ===== week view ===== */
.weekrow{display:flex; gap:10px; align-items:center; padding:11px 8px;
  border-bottom:1px solid var(--line);}
.weekrow.today{background:#12241c; border-radius:10px; border-bottom-color:transparent;}
.weekrow .wd{width:42px; flex-shrink:0; font-weight:700; font-size:.95rem;}
.weekrow .wd small{display:block; color:var(--faint); font-weight:400; font-size:.75rem;}
.weekrow .wbody{flex:1; min-width:0; font-size:.92rem;}
.weekrow .wstat{display:flex; gap:4px; flex-shrink:0; font-size:1rem;}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--line);}
.dot.on{background:var(--accent);} .dot.miss{background:#3a2320;}
/* ===== session screen ===== */
#session{position:fixed; inset:0; background:var(--bg); z-index:100; overflow-y:auto;
  display:none; padding-bottom:env(safe-area-inset-bottom);}
#session.open{display:block;}
.sess-inner{max-width:640px; margin:0 auto; min-height:100%;
  padding:calc(14px + env(safe-area-inset-top)) 14px 14px;
  display:flex; flex-direction:column;}
.sess-top{display:flex; justify-content:space-between; align-items:center; gap:8px;}
.sess-section{color:var(--accent); font-size:.9rem; font-weight:700;
  text-transform:uppercase; letter-spacing:.08em;}
.sess-name{font-size:1.6rem; font-weight:800; line-height:1.15; margin:10px 0 2px;}
.sess-rx{color:var(--blue); font-size:1.05rem; font-weight:600;}
.sess-cue{color:var(--dim); font-size:1rem; margin-top:6px;}
.bigtime{font-size:clamp(88px, 30vw, 200px); font-weight:800; text-align:center;
  font-variant-numeric:tabular-nums; line-height:1; margin:14px 0 4px; letter-spacing:-.02em;}
.bigtime.warn3{color:var(--amber);}
.bigtime.resting{color:var(--blue);}
.bigtime.transition{color:var(--amber);}
.progressbar{height:6px; border-radius:3px; background:var(--panel2); overflow:hidden; margin:4px 0 12px;}
.progressbar>div{height:100%; background:var(--accent); transition:width .25s linear;}
.nextup{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px; margin-top:auto; font-size:.98rem;}
.nextup .nu-label{color:var(--faint); font-size:.78rem; text-transform:uppercase; letter-spacing:.06em;}
.controls{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; margin-top:12px;}
.controls button{min-height:62px; font-size:1rem; font-weight:600;}
.controls .pausebtn{background:var(--accent); color:#06170f;}
.yn{display:flex; gap:12px; margin-top:12px;}
.yn button{flex:1; min-height:70px; font-size:1.2rem; font-weight:700;}
svg.chart{width:100%; height:auto; display:block;}
.modal-back{position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:200;
  display:flex; align-items:center; justify-content:center; overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top)) 18px 18px;}
.modal{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px; max-width:440px; width:100%;}
.scorebtns{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
.scorebtns button{min-height:64px; text-align:left; font-weight:600;}
.scorebtns button b{display:block; font-size:1.05rem;}
.scorebtns button span{color:var(--dim); font-size:.85rem; font-weight:400;}
.steplist{max-height:62vh; overflow-y:auto; margin:8px 0;}
.steplist .sl-row{padding:10px 6px; border-bottom:1px solid var(--line); font-size:.95rem;}
.steplist .sl-row.cur{color:var(--accent); font-weight:700;}
.steplist .sl-row.done{color:var(--faint);}
.steplist h3{margin:12px 0 4px; color:var(--blue);}
.done-check{color:var(--accent); font-weight:700;}
ul.tight{margin:6px 0; padding-left:20px;}
ul.tight li{margin:4px 0;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.statbig{font-size:2.2rem; font-weight:800; color:var(--accent); line-height:1;}
.checkrow{display:flex; align-items:center; gap:12px; padding:12px 4px; border-top:1px solid var(--line);}
.checkrow .cbox{width:34px; height:34px; border-radius:9px; border:2px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0;}
.checkrow .cbox.on{background:var(--accent); border-color:var(--accent); color:#06170f;}
.checkrow button{background:none; padding:0; min-height:44px; flex:1; text-align:left;
  display:flex; align-items:center; gap:12px;}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="session"></div>
<div id="modalhost"></div>
<nav class="nav" id="nav">
  <button data-v="today"><span class="ico">🏋️</span>Today</button>
  <button data-v="week"><span class="ico">📅</span>Week</button>
  <button data-v="prog"><span class="ico">📈</span>Progression</button>
  <button data-v="data"><span class="ico">💾</span>Data</button>
</nav>

<script>
"use strict";
/* =====================================================================
   Workout Tracker — Spec v3: Daily Single-Movement Rotation
   Supersedes the twice-weekly session model of v2.
   Mobility block and monitoring rules carry over from
   kinetic-chain-program-v2.md unchanged.
   ===================================================================== */

const MOVEMENTS = {
  bss: {
    id:"bss", name:"Bulgarian split squat", short:"BSS",
    reps:8, perSide:true, unit:"lbs/hand",
    tempo:"3 sec down · 1 sec pause · 2 sec up",
    cue:"Rear foot on bench. Front shin near vertical. Knee tracks over second toe.",
    loads:{ 100:[10,10,15,15,20,25], 85:[5,5,10,10,15,15] },
    labels:{
      100:["10 lbs/hand","10 lbs/hand","15 lbs/hand","15 lbs/hand","20 lbs/hand","25 lbs/hand"],
      85:["Bodyweight or 5 lbs/hand","Bodyweight or 5 lbs/hand","10 lbs/hand","10 lbs/hand","15 lbs/hand","15 lbs/hand"]
    }
  },
  sl_rdl: {
    id:"sl_rdl", name:"Single-leg RDL (B-stance)", short:"SL RDL",
    reps:8, perSide:true, unit:"lbs",
    tempo:"3 sec down · 1 sec pause · 2 sec up",
    cue:"B-stance: rear toes lightly down for balance, weight through the front leg. Dumbbell in the hand opposite the working leg. Hinge at the hip.",
    loads:{ 100:[15,15,20,20,25,25], 85:[10,10,15,15,20,20] },
    labels:null
  },
  step_down: {
    id:"step_down", name:"Eccentric step-down", short:"Step-down",
    reps:8, perSide:true, unit:"lbs at chest",
    tempo:"4 sec lower · tap heel · 2 sec up",
    cue:"Stand on bench. Knee tracks over second toe, no medial collapse. Film from the front periodically.",
    loads:{ 100:[0,0,10,10,15,15], 85:[0,0,0,0,10,10] },
    labels:{
      100:["Bodyweight","Bodyweight","10 lbs at chest","10 lbs at chest","15 lbs at chest","15 lbs at chest"],
      85:["Bodyweight","Bodyweight","Bodyweight","Bodyweight","10 lbs at chest","10 lbs at chest"]
    }
  }
};

const PROGRAM = {
  title: "Kinetic Chain Performance Program",
  specVersion: 3,
  weeks: 6,
  rirStandard: 2,
  rirPostMatch: 3,
  postMatchWindowMin: 90,
  setRest: 90,
  // Fixed weekly rotation. Index 0 = Sunday ... 6 = Saturday.
  rotation: [
    { day:0, type:"match_post", label:"Match + post-match lift", loadPct:100,
      movements:[{ id:"sl_rdl", sets:3 }], est:"~6 min", match:true },
    { day:1, type:"recovery", label:"Recovery", loadPct:null,
      movements:[], est:"mobility block only" },
    { day:2, type:"strength", label:"Strength", loadPct:100,
      movements:[{ id:"bss", sets:3 }, { id:"step_down", sets:2 }], est:"~12 min" },
    { day:3, type:"match_post", label:"Match + post-match lift", loadPct:85,
      movements:[{ id:"sl_rdl", sets:3 }], est:"~6 min", match:true },
    { day:4, type:"recovery", label:"Recovery", loadPct:null,
      movements:[], est:"mobility block only" },
    { day:5, type:"strength", label:"Strength", loadPct:100,
      movements:[{ id:"step_down", sets:3 }], est:"~6 min" },
    { day:6, type:"strength", label:"Strength + jog", loadPct:85,
      movements:[{ id:"bss", sets:3 }], est:"~6 min", jog:true }
  ],
  jogRules: [
    "Strictly conversational pace. If full sentences are hard, slow down.",
    "Hard cap at 30 minutes. Aerobic maintenance only — matches provide intensity.",
    "If legs feel heavy Sunday morning or match performance dips, trim to 20 min or move the jog to Monday and make Saturday full rest."
  ],
  symptomScale: [
    { score:0, label:"No change", note:"Same as any other morning." },
    { score:1, label:"Mild increase", note:"Noticeable, settles as you move." },
    { score:2, label:"Moderate increase", note:"Present through the morning." },
    { score:3, label:"Significant increase", note:"Limiting how you move." }
  ],
  // Daily mobility block — unchanged from v2. Runs every day including recovery days.
  mobility: {
    sectionRest: 60, transitionSame: 5, transitionNew: 10,
    sections: [
      { name:"Section 1 · Ankle Flow", items:[
        { name:"Gastroc wall stretch",  sets:2, perSide:true, dur:45, rx:"2 × 45 sec/side", cue:"Knee straight, heel pressed into floor." },
        { name:"Soleus wall stretch",   sets:2, perSide:true, dur:45, rx:"2 × 45 sec/side", cue:"Bend back knee ~20°, no position change from the gastroc stretch." },
        { name:"Banded talocrural mobilization", sets:2, perSide:true, manual:true, reps:10, rx:"2 × 10 reps/side", cue:"Band at ankle crease pulling posteriorly, heel stays down." },
        { name:"Eccentric calf raises", sets:2, perSide:true, manual:true, reps:15, rx:"2 × 15/side · rise 2 sec on both feet, lower 3 sec on one leg", cue:"Use a stair edge for full range." }
      ]},
      { name:"Section 1b · Right MTP Mobilization", mtp:true, noRestBefore:true, items:[
        { name:"Passive MTP mobilization (right)", sets:2, perSide:false, manual:true, reps:12, rx:"2 × 10–15 reps · 3–4 sec hold at end range", cue:"Stabilize the metatarsal head with the opposite hand, push the toe straight upward — not laterally." },
        { name:"Toe extension stretch (right)", sets:3, perSide:false, dur:30, rx:"3 × 30 sec", cue:"Sustained hold at end range." }
      ]},
      { name:"Section 2 · Hip Rotation Flow", items:[
        { name:"90/90 ER stretch — Left",  sets:3, perSide:false, dur:30, rx:"3 × 30 sec", cue:"Tall spine, hinge over the front leg." },
        { name:"90/90 IR stretch — Left",  sets:3, perSide:false, dur:30, rx:"3 × 30 sec", cue:"Weight shift toward the back leg, no repositioning." },
        { name:"90/90 ER stretch — Right", sets:3, perSide:false, dur:30, rx:"3 × 30 sec", cue:"Swap legs, same cues: tall spine, hinge over the front leg." },
        { name:"90/90 IR stretch — Right", sets:3, perSide:false, dur:30, rx:"3 × 30 sec", cue:"Weight shift toward the back leg." },
        { name:"Hip CARs — Left",  sets:2, perSide:false, dur:40, rx:"3 circles each direction · 10–15 sec per circle", cue:"Largest possible arc, no pelvic compensation.", setNames:["clockwise","counter-clockwise"] },
        { name:"Hip CARs — Right", sets:2, perSide:false, dur:40, rx:"3 circles each direction · 10–15 sec per circle", cue:"Largest possible arc, no pelvic compensation.", setNames:["clockwise","counter-clockwise"] }
      ]},
      { name:"Section 3 · Hip Flexor Flow", items:[
        { name:"Half-kneeling hip flexor stretch with PPT", sets:2, perSide:true, dur:45, rx:"2 × 45 sec/side", cue:"Squeeze rear glute, tuck tailbone, lean forward. Feel it at the front of the rear hip, not the low back." },
        { name:"Foam roll quads / rectus femoris", sets:1, perSide:true, dur:120, rx:"2 min/side", cue:"Hip to just above knee, slow passes, extra time on tender spots." }
      ]}
    ]
  },
  postMatchMobility: {
    name:"Post-Match Mobility (~10 min)",
    items:[
      { name:"Half-kneeling hip flexor stretch with PPT", sets:2, perSide:true, dur:30, rx:"2 × 30 sec/side", cue:"Squeeze rear glute, tuck tailbone, lean forward." },
      { name:"90/90 ER stretch", sets:1, perSide:true, dur:30, rx:"1 × 30 sec/side", cue:"Tall spine, hinge over the front leg." },
      { name:"90/90 IR stretch", sets:1, perSide:true, dur:30, rx:"1 × 30 sec/side", cue:"Weight shift toward the back leg." },
      { name:"Gastroc wall stretch", sets:1, perSide:true, dur:45, rx:"1 × 45 sec/side", cue:"Knee straight, heel pressed into floor." },
      { name:"Soleus wall stretch", sets:1, perSide:true, dur:45, rx:"1 × 45 sec/side", cue:"Bend back knee ~20°." },
      { name:"Massage gun — psoas region (optional)", sets:1, perSide:true, dur:90, rx:"90 sec/side · optional, as tolerated", cue:"Skip this step if you don't have the massage gun handy." }
    ]
  },
  recoveryAddOns: [
    "Supine hip IR stretch with band — 2 × 30 sec/side",
    "Foam roll adductors and lateral hip — 90 sec/area",
    "Massage gun general lower body"
  ],
  rules: {
    kneeGate: "Every set logs knee tracking over the second toe. A failed set ends that exercise for the day and the failure is recorded against the load.",
    symptom: "Next-morning symptom check, scored and attributed to the prior day's activity. Two consecutive failed checks attributed to the same movement lock that movement's load.",
    behavioral: "Ongoing cue: deliberate big-toe push-off during walking and running, both sides. Right side needs conscious cueing due to MTP stiffness. Metatarsal pad soreness under appropriate load is expected adaptation, not a red flag."
  },
  wblt: "Monthly WBLT spot check: feet straight on tile grout lines, knee to wall, heel flat, measure to 0.25 inch. If left falls more than 0.5 inch behind right, restore daily left-side ankle bias (3 sets left daily, right 3×/week).",
  redFlags: "Stop and get evaluated for: joint effusion or swelling, night pain, locking, catching, giving way, focal joint-line tenderness, or symptoms worsening session over session."
};

/* ===================== date helpers ===================== */
function localISO(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function todayStr(){ return localISO(new Date()); }
function dowOf(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).getDay(); }
function mondayStr(d){
  const c = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  c.setDate(c.getDate() - ((c.getDay()+6)%7));
  return localISO(c);
}
function mondayOf(iso){ const [y,m,d]=iso.split("-").map(Number); return mondayStr(new Date(y,m-1,d)); }
function addDays(iso, n){
  const [y,m,d] = iso.split("-").map(Number);
  return localISO(new Date(y, m-1, d+n));
}
function fmtDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
}
function fmtShort(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short", day:"numeric"});
}
function daysBetween(a,b){
  const [ay,am,ad]=a.split("-").map(Number), [by,bm,bd]=b.split("-").map(Number);
  return Math.round((new Date(by,bm-1,bd) - new Date(ay,am-1,ad)) / 86400000);
}
function fmtTime(ts){
  if (!ts) return "—";
  return new Date(ts).toLocaleTimeString(undefined,{hour:"numeric", minute:"2-digit"});
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function clampWeek(w){ return Math.min(Math.max(w||1,1), PROGRAM.weeks); }

/* ===================== state ===================== */
const LS_KEY = "kct_v1";
let state = null;

function defaultState(){
  return {
    v: 3,
    firstSeen: todayStr(),
    program: { week: 1, weekStart: mondayStr(new Date()), notice: null },
    days: {},            // keyed by YYYY-MM-DD
    symptomChecks: [],   // {date, score, attribution, movements[], week, forDate}
    logs: [],            // WBLT entries + preserved v2 history
    lastExport: null,
    activeSession: null,
    settings: { sound: true, vibrate: true }
  };
}
function blankDay(date){
  const rot = rotationFor(date);
  return {
    date,
    type: rot.type,
    movements: rot.movements.map(m=>m.id),
    movement: rot.movements.length ? rot.movements[0].id : null, // spec-compat single field
    loadPct: rot.loadPct,
    week: null,
    work: {},            // {movementId: {sets:[...], failed:bool}}
    sets: [],            // spec-compat flattened mirror
    matchEndTime: null,
    matchLogged: false,
    mobilityComplete: false,
    mtpComplete: false,
    jog: null
  };
}
function rotationFor(dateOrDow){
  const dow = typeof dateOrDow === "number" ? dateOrDow : dowOf(dateOrDow);
  return PROGRAM.rotation[dow];
}
function getDay(date, create){
  let d = state.days[date];
  if (!d){
    if (!create) return null;
    d = state.days[date] = blankDay(date);
  }
  if (d.week == null) d.week = programWeekFor(date);
  return d;
}
function dayOrBlank(date){ return state.days[date] || blankDay(date); }

/* migrate a v2 (session-model) save into the v3 day model, losing nothing */
function migrate(old){
  if (!old || old.v >= 3) return old;
  const out = defaultState();
  out.firstSeen = old.firstSeen || todayStr();
  out.program = { week: (old.program && old.program.week) || 1,
                  weekStart: (old.program && old.program.weekStart) || mondayStr(new Date()),
                  notice: null };
  out.lastExport = old.lastExport || null;
  out.settings = old.settings || { sound:true, vibrate:true };
  out.migratedFromV2 = true;
  (old.logs || []).forEach(l=>{
    const touch = () => {
      if (!out.days[l.date]) out.days[l.date] = blankDay(l.date);
      return out.days[l.date];
    };
    if (l.type === "mobility"){
      const d = touch(); d.mobilityComplete = true; d.mtpComplete = true;
      if (l.repWork) d.repWork = l.repWork;
    } else if (l.type === "postmatch"){
      touch().postMatchMobility = true;
    } else if (l.type === "match"){
      const d = touch();
      d.matchLogged = true; d.matchMinutes = l.minutes;
      d.matchNote = l.note; d.matchSymptoms = l.symptoms;
    } else if (l.type === "jog"){
      touch().jog = { minutes: l.minutes, conversational: l.conversational };
    } else if (l.type === "symptom"){
      out.symptomChecks.push({ date: l.date, score: l.increased ? 2 : 0,
        attribution: "lift", movements: [], week: out.program.week,
        forDate: l.forDate || addDays(l.date,-1), legacy: true });
    } else {
      out.logs.push(l); // WBLT + v2 strength sessions, kept for history and export
    }
  });
  return out;
}
function load(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    state = raw ? JSON.parse(raw) : defaultState();
  } catch(e){ state = defaultState(); }
  state = migrate(state);
  if (!state || !state.program) state = defaultState();
  if (!state.days) state.days = {};
  if (!state.symptomChecks) state.symptomChecks = [];
  if (!state.logs) state.logs = [];
}
let saveTimer = null;
function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); }

/* ===================== program week ===================== */
function rolloverWeek(){
  const p = state.program;
  const nowMon = mondayStr(new Date());
  let guard = 0;
  while (daysBetween(p.weekStart, nowMon) >= 7 && guard++ < 400){
    p.weekStart = addDays(p.weekStart, 7);
    if (p.week < PROGRAM.weeks) p.week++;
    else p.notice = "You've finished the 6-week progression. Holding at Week 6 loads — export your data for a program review.";
  }
  saveSoon();
}
function programWeekFor(date){
  const diff = daysBetween(state.program.weekStart, mondayOf(date));
  return clampWeek(state.program.week + Math.round(diff/7));
}
function setWeekManually(w){
  state.program.week = w;
  state.program.weekStart = mondayStr(new Date());
  state.program.notice = null;
  save(); render();
}

/* ===================== loads and locks =====================
   Two consecutive failed symptom checks attributed to the same movement lock
   that movement's load. Match-day (Wed/Sun) failures lock the match-day sets;
   standard-day loads only lock after standard-day failures. */
function computeLocks(){
  const locks = {};
  Object.keys(MOVEMENTS).forEach(mid=>{
    const checks = state.symptomChecks
      .filter(c => (c.movements||[]).includes(mid))
      .sort((a,b)=>a.date.localeCompare(b.date));
    if (checks.length < 2) return;
    const last2 = checks.slice(-2);
    if (!last2.every(c => c.score > 0)) return;
    const cats = last2.map(c => String(c.attribution||"").indexOf("match") >= 0 ? "match" : "standard");
    locks[mid] = {
      category: cats.includes("match") ? "match" : "standard",
      week: clampWeek(Math.min(last2[0].week || 1, last2[1].week || 1)),
      dates: last2.map(c=>c.date)
    };
  });
  return locks;
}
function categoryOf(dayType){ return dayType === "match_post" ? "match" : "standard"; }

function loadFor(mid, loadPct, week, dayType){
  const m = MOVEMENTS[mid];
  const lock = computeLocks()[mid];
  let effWeek = clampWeek(week), locked = false;
  if (lock && lock.category === categoryOf(dayType) && lock.week < effWeek){
    effWeek = lock.week; locked = true;
  }
  const i = effWeek - 1;
  const num = m.loads[loadPct][i];
  const label = m.labels ? m.labels[loadPct][i] : (num ? `${num} ${m.unit}` : "Bodyweight");
  return { num, label, locked, lockWeek: locked ? effWeek : null, unit:m.unit };
}
function rirTargetFor(dayType){
  return dayType === "match_post" ? PROGRAM.rirPostMatch : PROGRAM.rirStandard;
}
function kneeFailCount(mid){
  let n = 0;
  Object.values(state.days).forEach(d=>{
    const w = d.work && d.work[mid];
    if (w) n += (w.sets||[]).filter(s=>s.kneeTrackingPass === false).length;
  });
  return n;
}

/* ===================== audio + vibration + wake lock ===================== */
let audioCtx = null;
function ensureAudio(){
  if (!state.settings.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch(e){}
}
function beep(freq, dur, when){
  if (!state.settings.sound || !audioCtx) return;
  try {
    const t = audioCtx.currentTime + (when||0);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t+dur+0.05);
  } catch(e){}
}
function buzz(pattern){
  if (!state.settings.vibrate) return;
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e){}
}
function cueWarn(){ beep(880, .12); buzz(60); }
function cueEnd(){ beep(660, .18); beep(990, .3, .2); buzz([160,80,160]); }

let wakeLock = null;
async function grabWakeLock(){
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch(e){}
}
function dropWakeLock(){ try { if (wakeLock){ wakeLock.release(); wakeLock = null; } } catch(e){} }
document.addEventListener("visibilitychange", ()=>{
  if (document.visibilityState === "visible" && state && state.activeSession) grabWakeLock();
});

/* ===================== mobility flow (unchanged from v2) ===================== */
function buildFlow(sections, sectionRestSec){
  const steps = [];
  sections.forEach((sec, si)=>{
    if (si > 0 && !sec.noRestBefore){
      steps.push({ type:"rest", name:"Section rest", cue:"Breathe. Next section starts automatically.", dur:sectionRestSec, section:sec.name });
    }
    sec.items.forEach(item=>{
      for (let s=1; s<=item.sets; s++){
        const sides = item.perSide ? ["Left","Right"] : [null];
        sides.forEach(side=>{
          let label = item.name;
          if (item.setNames) label += " — " + item.setNames[s-1];
          if (side) label += " — " + side;
          steps.push({
            type:"ex", name:label, base:item.name, cue:item.cue, rx:item.rx,
            dur:item.dur, manual:!!item.manual, reps:item.reps, mtp:!!sec.mtp,
            section:sec.name, side, set:s, sets:item.sets
          });
        });
      }
    });
  });
  const out = [];
  for (let i=0; i<steps.length; i++){
    const cur = steps[i], prev = out.length ? out[out.length-1] : null;
    if (prev && prev.type !== "rest" && cur.type !== "rest" && !cur.manual){
      const sameEx = prev.base === cur.base;
      const switching = sameEx && prev.side !== cur.side && cur.side;
      out.push({ type:"trans", name: switching ? "Switch sides" : "Get set",
        next: cur, dur: sameEx ? PROGRAM.mobility.transitionSame : PROGRAM.mobility.transitionNew,
        section: cur.section });
    }
    out.push(cur);
  }
  return out;
}
function mobilitySteps(){ return buildFlow(PROGRAM.mobility.sections, PROGRAM.mobility.sectionRest); }
function postMatchSteps(){ return buildFlow([{name:PROGRAM.postMatchMobility.name, items:PROGRAM.postMatchMobility.items}], 60); }

/* ===================== session engine ===================== */
let tickHandle = null, lastWarnSec = null, lastPersist = 0;
function S(){ return state.activeSession; }

function startMobility(kind){ // 'mobility' | 'postmatch'
  ensureAudio();
  state.activeSession = {
    id: uid(), kind, date: todayStr(), startedAt: Date.now(),
    steps: kind === "postmatch" ? postMatchSteps() : mobilitySteps(),
    idx: 0, timer: null, stage:"flow", repEntries: []
  };
  armStep(); grabWakeLock(); openSession(); startTick(); save();
}
function armStep(){
  const s = S(); const st = s.steps[s.idx];
  if (st.manual) s.timer = null;
  else s.timer = { endsAt: Date.now() + st.dur*1000, total: st.dur, paused:false, remaining:null };
  lastWarnSec = null;
}
function logMobilitySet(){
  const s = S(); const st = s.steps[s.idx];
  const el = document.getElementById("in-mreps");
  const reps = el ? (parseInt(el.value) || 0) : (st.reps || 0);
  (s.repEntries = s.repEntries || []).push({ name: st.base, side: st.side, set: st.set, reps });
  ensureAudio(); beep(880,.1); buzz(40);
  advanceFlow(false);
}
function timerRemaining(){
  const s = S(); if (!s || !s.timer) return 0;
  return s.timer.paused ? s.timer.remaining : Math.max(0, (s.timer.endsAt - Date.now())/1000);
}
function pauseToggle(){
  const s = S(); if (!s || !s.timer) return;
  ensureAudio();
  if (s.timer.paused){ s.timer.endsAt = Date.now() + s.timer.remaining*1000; s.timer.paused = false; }
  else { s.timer.remaining = timerRemaining(); s.timer.paused = true; }
  save(); renderSession();
}
function plus15(){
  const s = S(); if (!s || !s.timer) return;
  if (s.timer.paused) s.timer.remaining += 15; else s.timer.endsAt += 15000;
  save(); renderSession();
}
function skipStep(){ advanceFlow(true); }
function backStep(){
  const s = S();
  let i = s.idx - 1;
  while (i >= 0 && s.steps[i].type !== "ex") i--;
  const cur = s.steps[s.idx];
  const elapsed = (cur && cur.type === "ex" && !cur.manual) ? cur.dur - timerRemaining() : 0;
  if (elapsed > 4) armStep();
  else if (i >= 0){ s.idx = i; armStep(); }
  else armStep();
  save(); renderSession();
}
function advanceFlow(skipped){
  const s = S();
  if (s.idx >= s.steps.length - 1){ finishFlow(); return; }
  s.idx++;
  if (skipped && s.steps[s.idx] && s.steps[s.idx].type === "trans" && s.idx < s.steps.length-1) s.idx++;
  armStep(); save(); renderSession();
}
function finishFlow(){
  const s = S();
  recordFlowCompletion(s, true);
  cueEnd();
  state.activeSession = null;
  dropWakeLock(); stopTick(); save();
  closeSession(); render();
  toast(s.kind === "postmatch" ? "Post-match mobility logged ✓" : "Mobility block complete — logged ✓");
}
function recordFlowCompletion(s, full){
  const d = getDay(s.date, true);
  if (s.kind === "postmatch"){ d.postMatchMobility = true; }
  else {
    d.mobilityComplete = true;
    // MTP is Section 1b of the block; it only counts if those steps were reached
    const mtpIdx = s.steps.findIndex(st => st.mtp);
    const lastMtp = s.steps.reduce((acc,st,i)=> st.mtp ? i : acc, -1);
    if (full || (lastMtp >= 0 && s.idx > lastMtp)) d.mtpComplete = true;
    d.mobilityMinutes = Math.round((Date.now() - s.startedAt)/60000);
    if (s.repEntries && s.repEntries.length) d.repWork = s.repEntries;
  }
}
function endSessionEarly(){
  showModal(`<h2>End session?</h2>
    <p class="dim">Nothing from this block will be logged.</p>
    <div class="yn"><button class="warn" onclick="confirmEnd()">End it</button>
    <button onclick="closeModal()">Keep going</button></div>`);
}
function confirmEnd(){
  closeModal();
  state.activeSession = null;
  dropWakeLock(); stopTick(); save();
  closeSession(); render();
}
function startTick(){ stopTick(); tickHandle = setInterval(tick, 250); }
function stopTick(){ if (tickHandle){ clearInterval(tickHandle); tickHandle = null; } }
function tick(){
  const s = S(); if (!s || !s.timer || s.timer.paused) return;
  const rem = timerRemaining(), whole = Math.ceil(rem);
  if (whole !== lastWarnSec && whole <= 3 && whole >= 1){ lastWarnSec = whole; cueWarn(); }
  updateTimeDisplay(rem);
  if (Date.now() - lastPersist > 4000){ lastPersist = Date.now(); save(); }
  if (rem <= 0){ cueEnd(); advanceFlow(false); }
}
function updateTimeDisplay(rem){
  const el = document.getElementById("bigtime");
  if (!el) return;
  el.textContent = fmtClock(rem);
  el.classList.toggle("warn3", rem <= 3.5 && rem > 0);
  const bar = document.getElementById("stepbar"), s = S();
  if (bar && s && s.timer && s.timer.total) bar.style.width = (100 - (rem/s.timer.total)*100) + "%";
}
function fmtClock(sec){
  sec = Math.max(0, Math.ceil(sec));
  const m = Math.floor(sec/60), s2 = sec % 60;
  return m > 0 ? `${m}:${String(s2).padStart(2,"0")}` : String(s2);
}
function resumeSession(){
  const s = S(); if (!s) return;
  if (s.timer && !s.timer.paused){
    let overdue = (Date.now() - s.timer.endsAt)/1000;
    if (overdue > 300){ s.timer.paused = true; s.timer.remaining = s.timer.total; }
    else if (overdue > 0){
      let guard = 0;
      while (overdue > 0 && s.idx < s.steps.length - 1 && guard++ < 200){
        s.idx++;
        const st = s.steps[s.idx];
        if (st.manual){ s.timer = null; overdue = 0; break; }
        s.timer = { endsAt: s.timer.endsAt + st.dur*1000, total: st.dur, paused:false };
        overdue = (Date.now() - s.timer.endsAt)/1000;
      }
      if (overdue > 0){
        recordFlowCompletion(s, true);
        state.activeSession = null; save(); closeSession(); render(); return;
      }
    }
  }
  grabWakeLock(); openSession(); startTick(); save();
}

/* ===================== session rendering ===================== */
function openSession(){ document.getElementById("session").classList.add("open"); renderSession(); }
function closeSession(){ document.getElementById("session").classList.remove("open"); }
function renderSession(){
  const host = document.getElementById("session"), s = S();
  if (!s){ closeSession(); return; }
  host.innerHTML = flowHTML(s);
  updateTimeDisplay(timerRemaining());
}
function flowHTML(s){
  const st = s.steps[s.idx];
  const exSteps = s.steps.filter(x=>x.type==="ex");
  const doneEx = s.steps.slice(0, s.idx).filter(x=>x.type==="ex").length + (st.type==="ex"?1:0);
  const nxt = nextExercise(s);
  let title, rx, cue, cls="";
  if (st.type === "ex"){
    title = st.name; rx = st.rx + (st.sets>1 && !st.setNames ? ` · set ${st.set}/${st.sets}` : ""); cue = st.cue;
  } else if (st.type === "trans"){
    title = st.name === "Switch sides" ? "Switch sides" : ("Next: " + st.next.name);
    rx = st.next ? st.next.rx : ""; cue = st.next ? st.next.cue : ""; cls = "transition";
  } else {

  }
  const paused = s.timer && s.timer.paused;
  const kindLabel = s.kind === "postmatch" ? "Post-match mobility" : "Daily mobility block";
  const isManual = st.type === "ex" && st.manual;
  const middle = isManual
    ? `<div style="margin:20px 0;">

    : `<div class="controls">
        <button onclick="backStep()">⏮ Back</button>

        <button onclick="plus15()">+15 s</button>

  return `<div class="sess-inner">
    <div class="sess-top">

    ${controls}
  </div>`;
}
function nextExercise(s){
  for (let i=s.idx+1; i<s.steps.length; i++) if (s.steps[i].type === "ex") return s.steps[i];
  return null;
}
function showStepList(){

  while (curEx < s.steps.length && s.steps[curEx].type !== "ex") curEx++;

  let lastSection = "";

  });

function jumpToStep(i){

/* ===================== strength: inline day logging ===================== */
let setDraft = {};   // {movementId: {knee: true|false|null, reps, rir}}
let restUntil = null, restFor = null;   // inter-set rest, scoped to one movement

function draftFor(mid, dayType){
  if (!setDraft[mid]) setDraft[mid] = { knee:null, reps:MOVEMENTS[mid].reps, rir:rirTargetFor(dayType) };
  return setDraft[mid];
}
function todayType(){ return rotationFor(todayStr()).type; }
function setKnee(mid, pass){
  draftFor(mid, todayType()).knee = pass;
  ensureAudio(); beep(pass ? 880 : 400, .1); buzz(40);
  render();
}
function setRir(mid, v){ draftFor(mid, todayType()).rir = v; render(); }

function logStrengthSet(mid){
  const date = todayStr(), d = getDay(date, true);
  const rot = rotationFor(date);
  const spec = rot.movements.find(m=>m.id===mid);
  const draft = draftFor(mid, d.type);
  if (draft.knee === null){ toast("Log knee tracking first"); return; }
  const repsEl = document.getElementById("reps-"+mid);
  if (repsEl) draft.reps = parseInt(repsEl.value) || 0;

  const w = d.work[mid] = d.work[mid] || { sets: [], failed: false };
  const ld = loadFor(mid, d.loadPct, d.week, d.type);
  w.sets.push({
    setNumber: w.sets.length + 1,
    load: ld.num,
    reps: draft.reps,
    rir: draft.rir,
    kneeTrackingPass: draft.knee,
    loggedAt: Date.now()
  });
  if (draft.knee === false) w.failed = true;          // knee gate: ends the exercise today
  d.sets = flattenSets(d);                             // keep spec-compat mirror in sync
  d.week = d.week || programWeekFor(date);

  // post-match window check
  if (d.type === "match_post" && d.matchEndTime){
    const mins = Math.round((Date.now() - d.matchEndTime)/60000);
    if (mins > PROGRAM.postMatchWindowMin){
      w.sets[w.sets.length-1].outsideWindow = true;
      w.sets[w.sets.length-1].minsAfterMatch = mins;
    }
  }
  setDraft[mid] = { knee:null, reps:MOVEMENTS[mid].reps, rir:rirTargetFor(d.type) };
  const complete = w.failed || w.sets.length >= spec.sets;
  if (!complete){ restUntil = Date.now() + PROGRAM.setRest*1000; restFor = mid; startRestTick(); }
  else { restUntil = null; restFor = null; }
  cueEnd();
  save(); render();
  if (draft.knee === false) toast("Knee caved — " + MOVEMENTS[mid].name + " is done for today.");
}
function undoStrengthSet(mid){
  const d = getDay(todayStr(), true), w = d.work[mid];
  if (!w || !w.sets.length) return;
  w.sets.pop();
  w.failed = w.sets.some(s=>s.kneeTrackingPass === false);
  d.sets = flattenSets(d);
  restUntil = null; restFor = null;
  save(); render();
}
function flattenSets(d){
  const out = [];
  (d.movements||[]).forEach(mid=>{
    const w = d.work[mid];
    if (w) w.sets.forEach(s=>out.push(Object.assign({ movement: mid }, s)));
  });
  return out;
}
let restHandle = null;
function startRestTick(){
  clearInterval(restHandle);
  restHandle = setInterval(()=>{
    if (!restUntil || Date.now() >= restUntil){
      clearInterval(restHandle); restHandle = null;
      if (restUntil){ restUntil = null; restFor = null; cueWarn(); render(); }
      return;
    }
    const el = document.getElementById("restchip");
    if (el) el.textContent = "Rest " + fmtClock((restUntil - Date.now())/1000);
    else { clearInterval(restHandle); restHandle = null; }
  }, 500);
}

/* ===================== match / jog / WBLT ===================== */

  const hh = String(now.getHours()).padStart(2,"0"), mm = String(now.getMinutes()).padStart(2,"0");
  return `<h2>Match complete</h2>
    <p class="faint" style="margin:0 0 6px;">The post-match lift unlocks once this is saved. Sets logged more than ${PROGRAM.postMatchWindowMin} minutes after the end time are flagged.</p>
    <label>Match ended at</label>
    <input type="time" id="m-end" value="${hh}:${mm}">
    <label>Minutes played</label>
    <input type="number" id="m-min" inputmode="numeric" min="0" value="${dowOf(todayStr())===0?90:40}">
    <label>Any knee symptoms during or after?</label>
    <select id="m-sym"><option value="no">No</option><option value="yes">Yes</option></select>
    <label>Note (optional)</label>
    <textarea id="m-note" placeholder="e.g. felt sharp on cuts, wore sleeve"></textarea>
    <div class="yn"><button class="primary" onclick="saveMatch()">Save ✓</button>
    <button class="ghost" onclick="closeModal()">Cancel</button></div>`;
}
function saveMatch(){
  const d = getDay(todayStr(), true);
  const t = document.getElementById("m-end").value || "";
  const [hh,mm] = t.split(":").map(Number);
  const now = new Date();
  const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh||now.getHours(), mm||now.getMinutes());
  d.matchLogged = true;
  d.matchEndTime = end.getTime();
  d.matchMinutes = parseInt(document.getElementById("m-min").value)||0;
  d.matchSymptoms = document.getElementById("m-sym").value === "yes";
  d.matchNote = document.getElementById("m-note").value.trim();
  save(); closeModal(); render();
  toast("Match logged ✓ — post-match lift is unlocked");
}

function wbltFormHTML(){
  return `<h2>WBLT spot check</h2>
    <p class="faint">Feet straight on tile grout lines, knee to wall, heel flat. Measure to the nearest 0.25 inch.</p>
    <div class="row">
      <div><label>Left (inches)</label><input type="number" id="w-l" inputmode="decimal" step="0.25" min="0"></div>
      <div><label>Right (inches)</label><input type="number" id="w-r" inputmode="decimal" step="0.25" min="0"></div>

function saveWblt(){
  const l = parseFloat(document.getElementById("w-l").value);
  const r = parseFloat(document.getElementById("w-r").value);
  if (isNaN(l) || isNaN(r)){ toast("Enter both measurements"); return; }
  const asym = Math.round((r - l)*100)/100;
  state.logs.push({ id: uid(), type:"wblt", date: todayStr(), left:l, right:r, asym });
  save(); closeModal(); render();
  if (asym > 0.5) showModal(`<h2 style="color:var(--red)">⚠️ Asymmetry alert</h2>
    <p>Left is <b>${asym}"</b> behind right — more than the 0.5" threshold.</p>
    <p class="dim">Per the program: restore the daily left-side ankle bias — 3 sets left daily, right 3×/week — until this closes.</p>
    <button class="primary big-btn" onclick="closeModal()">Got it</button>`);
  else toast(`WBLT saved — asymmetry ${asym}" (within 0.5" threshold ✓)`);
}
function lastWblt(){ return [...state.logs].reverse().find(l=>l.type==="wblt") || null; }

/* ===================== morning symptom check ===================== */
function attributionFor(checkDate){
  const prev = addDays(checkDate, -1);
  const rot = rotationFor(prev);
  const d = state.days[prev];
  const worked = d ? (d.movements||[]).filter(mid => d.work[mid] && d.work[mid].sets.length) : [];
  const matchDone = !!(d && (d.matchEndTime || d.matchLogged));
  let attribution;
  if (rot.type === "match_post" && worked.length) attribution = "match + lift";
  else if (rot.type === "match_post" && matchDone) attribution = "match";
  else if (worked.length) attribution = "lift";
  else attribution = "recovery";
  return { attribution, movements: worked, forDate: prev };
}
function morningCheckDue(){
  const t = todayStr();
  if (state.symptomChecks.some(c=>c.date === t)) return false;
  // nothing to attribute against before the first logged day
  return Object.keys(state.days).some(k => k < t) || !!state.migratedFromV2;
}
function askMorningCheck(){
  const t = todayStr();
  const info = attributionFor(t);
  const opts = PROGRAM.symptomScale.map(s=>
    `<button onclick="answerMorning(${s.score})"><b>${s.score} — ${esc(s.label)}</b><span>${esc(s.note)}</span></button>`).join("");
  showModal(`<h2>Morning check</h2>
    <p style="margin:0;"><b>Any increase in knee symptoms this morning?</b></p>
    <p class="faint" style="margin:6px 0 0;">Attributed to ${esc(fmtDate(info.forDate))} — <b>${esc(info.attribution)}</b>${info.movements.length ? " (" + info.movements.map(m=>MOVEMENTS[m].short).join(", ") + ")" : ""}</p>
    <div class="scorebtns">${opts}</div>
    <button class="ghost big-btn" onclick="deferMorning()">Ask me later today</button>`, true);
}
let morningDeferred = false;
function deferMorning(){ morningDeferred = true; closeModal(); render(); }
function answerMorning(score){
  const t = todayStr();
  const info = attributionFor(t);
  state.symptomChecks.push({
    date: t, score,
    attribution: info.attribution,
    movements: info.movements,
    forDate: info.forDate,
    week: programWeekFor(t)
  });
  save(); closeModal();
  const locks = computeLocks();
  const newLock = info.movements.find(m=>locks[m]);
  if (score > 0 && newLock){
    const lk = locks[newLock];
    showModal(`<h2>Load locked — ${esc(MOVEMENTS[newLock].name)}</h2>
      <p>Two consecutive symptom checks attributed to this movement came back positive, so its <b>${lk.category === "match" ? "match-day (Wed/Sun)" : "standard-day (Tue/Fri/Sat)"}</b> load is held at Week ${lk.week} instead of advancing.</p>
      <p class="dim">The lock clears itself as soon as a later check for this movement comes back at 0.</p>
      <button class="primary big-btn" onclick="closeModal(); render();">Understood</button>`);
  } else {
    render();
    toast(score === 0 ? "Morning check logged — no increase ✓" : "Morning check logged (score " + score + ")");
  }
}

function strengthCardHTML(d, rot, week){
  if (rot.type === "recovery")
    return `<div class="card accent"><h2>Recovery day</h2>
      <p class="dim" style="margin:4px 0 0;">No lift today. The mobility block below is the session — adherence on recovery days is the thing being tracked.</p></div>`;

  // Post-match gate: never present the strength prompt before the match is marked complete
  if (rot.type === "match_post" && !d.matchEndTime){
    return `<div class="card accent">
      <h2>Match first</h2>
      <p class="dim" style="margin:4px 0 10px;">Today's lift is a post-match set. Mark the match complete to unlock it — the app times the ${PROGRAM.postMatchWindowMin}-minute post-match window from the end time you enter.</p>
      <button class="primary big-btn" onclick="showModal(matchFormHTML())">Mark match complete</button>
    </div>`;
  }

  const rir = rirTargetFor(rot.type);
  let windowWarn = "";
  if (rot.type === "match_post" && d.matchEndTime){
    const mins = Math.round((Date.now() - d.matchEndTime)/60000);
    if (mins > PROGRAM.postMatchWindowMin)
      windowWarn = `<div class="banner amber" style="margin:10px 0 0;"><span>⏱ ${mins} min since the match ended — outside the ${PROGRAM.postMatchWindowMin}-minute post-match window. Sets logged now are flagged in your export.</span></div>`;
  }

  const blocks = rot.movements.map(spec=>{
    const m = MOVEMENTS[spec.id];
    const ld = loadFor(spec.id, rot.loadPct, week, rot.type);
    const w = d.work[spec.id] || { sets: [], failed: false };
    const done = w.sets.length, total = spec.sets;
    const complete = w.failed || done >= total;
    const draft = draftFor(spec.id, rot.type);

    const setRows = [];
    for (let i=1; i<=total; i++){
      const logged = w.sets[i-1];
      if (logged){
        setRows.push(`<div class="setblock done">
          <div class="set-head"><span>${logged.kneeTrackingPass ? '<span class="done-check">✓</span>' : '<span style="color:var(--red)">✕</span>'} Set ${i}</span>
          <span class="faint">${logged.load ? logged.load+" "+esc(m.unit) : "BW"} · ${logged.reps} reps · RIR ${logged.rir}${logged.outsideWindow ? " · ⏱ late" : ""}</span></div>
        </div>`);
      } else if (complete){
        setRows.push(`<div class="setblock blocked"><div class="set-head"><span>Set ${i}</span>
          <span class="faint">${w.failed ? "not performed" : "—"}</span></div></div>`);
      } else if (i === done + 1){
        setRows.push(activeSetHTML(spec.id, i, total, ld, rir, draft, m));
      } else {
        setRows.push(`<div class="setblock pending"><div class="set-head"><span>Set ${i}</span>
          <span class="faint">${ld.num ? ld.num+" "+esc(m.unit) : "Bodyweight"} · ${m.reps} reps/side</span></div></div>`);
      }
    }
    const restChip = (!complete && restFor === spec.id && restUntil && Date.now() < restUntil)
      ? `<span class="chip blue" id="restchip">Rest ${fmtClock((restUntil-Date.now())/1000)}</span>` : "";

    return `<div class="card ${complete?"":"accent"}">
      <div class="set-head">
        <h2 style="margin:0;">${esc(m.name)}</h2>
        ${complete ? '<span class="chip green">done</span>' : `<span class="chip">${done}/${total} sets</span>`}
      </div>
      <div class="loadbig" style="margin-top:8px;">${esc(ld.label)}</div>
      <div class="faint">${total} × ${m.reps}/side · ${esc(m.tempo)} · ${rot.loadPct}% · target RIR ${rir}
        ${ld.locked ? ` · <span style="color:var(--amber)">🔒 held at Week ${ld.lockWeek}</span>` : ""}</div>
      <div class="dim" style="font-size:.92rem; margin-top:6px;">${esc(m.cue)}</div>
      ${restChip}
      ${setRows.join("")}
      ${w.failed ? `<div class="banner red" style="margin:10px 0 0;"><span>Exercise complete for today — the knee caved on set ${w.sets.findIndex(s=>!s.kneeTrackingPass)+1}. The failure is recorded against ${esc(ld.label)} and shows up at the next progression decision.</span></div>` : ""}
      ${done ? `<button class="ghost small" style="margin-top:10px;" onclick="undoStrengthSet('${spec.id}')">↩ Undo last set</button>` : ""}
    </div>`;
  }).join("");

  return windowWarn + blocks;
}

/* ---------- 3. WEEK (adherence) ---------- */
let weekOffset = 0;
function shiftWeek(n){ weekOffset += n; render(); window.scrollTo(0,0); }
function weekHTML(){
  const mon = addDays(mondayStr(new Date()), weekOffset*7);
  const t = todayStr();
  const names = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  let done = 0, possible = 0;
  const rows = names.map((nm,i)=>{
    const date = addDays(mon, i);
    const rot = rotationFor(date);
    const d = dayOrBlank(date);
    const week = d.week || programWeekFor(date);
    const isToday = date === t;
    const future = date > t;

    const bits = [];
    if (rot.movements.length){
      rot.movements.forEach(spec=>{
        const m = MOVEMENTS[spec.id];
        const w = d.work[spec.id] || { sets: [], failed:false };
        const ld = loadFor(spec.id, rot.loadPct, week, rot.type);
        const failed = w.failed;
        bits.push(`${esc(m.short)} <span class="faint">${w.sets.length}/${spec.sets} · ${ld.num?ld.num+"lb":"BW"}</span>${failed?' <span style="color:var(--red)">✕knee</span>':""}`);
        if (!future){ possible++; if (w.sets.length >= spec.sets || w.failed) done++; }
      });
    } else {
      bits.push(`<span class="faint">Recovery — mobility only</span>`);
    }
    if (rot.match) bits.push(d.matchEndTime ? `<span class="faint">match ${fmtTime(d.matchEndTime)}</span>` : `<span class="faint">match not logged</span>`);
    if (rot.jog && d.jog) bits.push(`<span class="faint">jog ${d.jog.minutes}m</span>`);

    if (!future){ possible++; if (d.mobilityComplete) done++; }
    const check = state.symptomChecks.find(c=>c.date===date);

    return `<div class="weekrow ${isToday?"today":""}">
      <div class="wd">${nm}<small>${fmtShort(date).replace(/^\w+\s/,"")}</small></div>
      <div class="wbody">${bits.join(" · ")}
        ${check ? `<div class="faint">AM check: ${check.score} (${esc(check.attribution)})</div>` : ""}</div>
      <div class="wstat" title="mobility / MTP">
        <span class="dot ${d.mobilityComplete?"on":(future?"":"miss")}"></span>
        <span class="dot ${d.mtpComplete?"on":(future?"":"miss")}"></span>
      </div>
    </div>`;
  }).join("");

  const pct = possible ? Math.round(done/possible*100) : 0;
  return `<h1>Week</h1>
    <div class="row" style="margin-bottom:10px;">
      <button class="ghost small" onclick="shiftWeek(-1)">← Prev</button>
      <button class="ghost small" onclick="weekOffset=0; render();">${weekOffset===0?"This week":"Back to now"}</button>
      <button class="ghost small" onclick="shiftWeek(1)" ${weekOffset>=0?"disabled":""}>Next →</button>
    </div>
    <div class="card">
      <div class="set-head"><h2 style="margin:0;">Week of ${fmtShort(mon)}</h2>
        <span class="chip ${pct>=80?"green":(pct>=50?"amber":"red")}">${pct}% adherence</span></div>
      <p class="faint" style="margin:4px 0 6px;">Program week ${programWeekFor(mon)} · dots = mobility block / right MTP</p>
      ${rows}
    </div>
    <div class="card">
      <h3>Weekly exposure</h3>
      <p class="faint" style="margin:2px 0;">Bulgarian split squat ×2 (Tue 100%, Sat 85%) · SL RDL ×2 (Wed 85%, Sun 100%) · Eccentric step-down ×2 (Tue 100%, Fri 100%)</p>
    </div>`;
}

             <tr><td>Sat (85%)</td><td>${esc(loadFor(mid,85,week,"strength").label)}${loadFor(mid,85,week,"strength").locked?" 🔒":""}</td></tr>`
          : `<tr><td>Tue (100%, 2 sets)</td><td>${esc(loadFor(mid,100,week,"strength").label)}${loadFor(mid,100,week,"strength").locked?" 🔒":""}</td></tr>
             <tr><td>Fri (100%, 3 sets)</td><td>${esc(loadFor(mid,100,week,"strength").label)}${loadFor(mid,100,week,"strength").locked?" 🔒":""}</td></tr>`}
      </table>
      <p class="faint" style="margin:6px 0 0;">Knee tracking failures recorded: <b style="color:${fails?"var(--red)":"var(--accent)"}">${fails}</b></p>
      ${lk ? `<p class="faint" style="margin:4px 0 0;">Locked at Week ${lk.week} after positive morning checks on ${lk.dates.map(fmtShort).join(" and ")}. Clears when a later check for this movement scores 0.</p>` : ""}
    </div>`;
  }).join("");

  const checks = [...state.symptomChecks].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,14);
  return `<h1>Progression</h1>
    <div class="card">
      <div class="set-head"><h2 style="margin:0;">6-week load table</h2>
        <span class="chip green">Week ${week}</span></div>
      <p class="faint" style="margin:2px 0 6px;">Top number = 100% days, grey = 85% days.</p>
      <div class="tablewrap"><table class="loadtable">
        <tr><th>Movement</th>${[1,2,3,4,5,6].map(w=>`<th class="num">W${w}</th>`).join("")}</tr>
        ${rows}
      </table></div>
      <p class="faint">Override the current week:</p>
      <div class="row">${[1,2,3,4,5,6].map(w=>
        `<button class="small ${w===week?"primary":""}" onclick="setWeekManually(${w})">${w}</button>`).join("")}</div>
    </div>
    ${lockCards}
    <div class="card">
      <h2>Morning check history</h2>
      ${checks.length ? `<div class="tablewrap"><table>
        <tr><th>Date</th><th class="num">Score</th><th>Attributed to</th></tr>
        ${checks.map(c=>`<tr><td>${esc(fmtShort(c.date))}</td>
          <td class="num" style="color:${c.score>0?"var(--red)":"var(--accent)"}">${c.score}</td>
          <td>${esc(c.attribution)}${(c.movements||[]).length?' <span class="faint">'+c.movements.map(m=>MOVEMENTS[m].short).join(", ")+'</span>':""}</td></tr>`).join("")}
      </table></div>` : '<p class="faint">No checks logged yet.</p>'}
    </div>`;
}

/* ---------- 5. DATA ---------- */

  return `<h1>Data & backup</h1>

      <button class="big-btn" onclick="exportJSON()">⬇ Export JSON backup</button>

      <label style="display:flex; align-items:center; gap:10px; font-size:1rem; color:var(--text);">

/* ===================== export / import ===================== */
function download(filename, text, mime){
  const blob = new Blob([text], {type: mime || "text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 800);
}
function markExported(){ state.lastExport = todayStr(); save(); render(); }
function exportJSON(){
  download(`kinetic-tracker-backup-${todayStr()}.json`,
    JSON.stringify(Object.assign({}, state, { activeSession: null }), null, 2), "application/json");
  markExported();
  toast("JSON backup downloaded ✓");
}
function exportMarkdown(){
  const t = todayStr();
  const thisMon = mondayStr(new Date());
  const locks = computeLocks();
  let md = `# Kinetic Chain Tracker — Export ${t}\n\n`;
  md += `**Program:** ${PROGRAM.title}, spec v${PROGRAM.specVersion} (daily single-movement rotation)\n`;
  md += `**Current program week:** ${state.program.week} of ${PROGRAM.weeks}\n`;
  const lockList = Object.keys(locks);
  md += `**Active load locks:** ${lockList.length
    ? lockList.map(m=>`${MOVEMENTS[m].name} — ${locks[m].category}-day sets held at Week ${locks[m].week}`).join("; ")
    : "none"}\n\n`;
  md += `**Knee tracking failures to date:** ` +
    Object.keys(MOVEMENTS).map(m=>`${MOVEMENTS[m].short} ${kneeFailCount(m)}`).join(", ") + `\n\n`;
  md += `---\n\n`;

  for (let wk = 3; wk >= 0; wk--){
    const mon = addDays(thisMon, -wk*7);
    const label = wk === 0 ? " (current)" : "";
    md += `## Week of ${mon}${label} — program week ${programWeekFor(mon)}\n\n`;
    md += `| Date | Day | Movement | Load | Sets completed | Knee tracking | AM score |\n`;
    md += `|---|---|---|---|---|---|---|\n`;
    for (let i=0; i<7; i++){
      const date = addDays(mon, i);
      if (date > t) continue;
      const rot = rotationFor(date);
      const d = state.days[date];
      const dn = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][rot.day];
      const chk = state.symptomChecks.find(c=>c.date===date);
      const score = chk ? `${chk.score} (${chk.attribution})` : "—";
      if (rot.type === "recovery"){
        // Recovery days export as a single adherence line
        const mob = d && d.mobilityComplete ? "mobility ✓" : "mobility ✗";
        const mtp = d && d.mtpComplete ? "MTP ✓" : "MTP ✗";
        md += `| ${date} | ${dn} · Recovery | — (${mob}, ${mtp}) | — | — | — | ${score} |\n`;
        continue;
      }
      const week = (d && d.week) || programWeekFor(date);
      rot.movements.forEach((spec, mi)=>{
        const m = MOVEMENTS[spec.id];
        const w = (d && d.work[spec.id]) || { sets: [], failed:false };
        const ld = loadFor(spec.id, rot.loadPct, week, rot.type);
        const setsTxt = w.sets.length
          ? w.sets.map(s=>`${s.reps}@${s.load||"BW"}/RIR${s.rir}`).join(" ")
          : "none";
        const knee = w.sets.length
          ? (w.failed ? `FAIL on set ${w.sets.findIndex(s=>!s.kneeTrackingPass)+1}` : "all pass")
          : "—";
        const extras = [];
        if (mi === 0 && rot.match) extras.push(d && d.matchEndTime ? `match ended ${fmtTime(d.matchEndTime)}` : "match not logged");
        if (mi === 0 && rot.jog && d && d.jog) extras.push(`jog ${d.jog.minutes} min${d.jog.conversational?"":" (pace NOT conversational)"}`);
        if (mi === 0 && d && !d.mobilityComplete) extras.push("mobility ✗");
        if (mi === 0 && d && d.mobilityComplete) extras.push("mobility ✓");
        if (w.sets.some(s=>s.outsideWindow)) extras.push(`⏱ logged outside ${PROGRAM.postMatchWindowMin}-min window`);
        md += `| ${date} | ${dn} · ${rot.type === "match_post" ? "Match + post" : "Strength"} | ${m.name}${extras.length?` <br>_${extras.join(", ")}_`:""} | ${ld.label}${ld.locked?" 🔒":""} (${rot.loadPct}%) | ${w.sets.length}/${spec.sets} — ${setsTxt} | ${knee} | ${mi===0?score:"↑"} |\n`;
      });
    }
    md += `\n`;
  }

  const wblts = state.logs.filter(l=>l.type==="wblt");
  if (wblts.length){
    md += `## WBLT Spot Checks\n\n| Date | Left | Right | L behind R | Alert |\n|---|---|---|---|---|\n`;
    wblts.forEach(w=>{ md += `| ${w.date} | ${w.left} | ${w.right} | ${w.asym} | ${w.asym>0.5?"⚠️ YES":"—"} |\n`; });
    md += `\n`;
  }
  const legacy = state.logs.filter(l=>l.type==="strength");
  if (legacy.length){
    md += `## Archived v2 sessions (pre-rotation model)\n\n`;
    legacy.forEach(sl=>{
      md += `- **${sl.date}** (${sl.variant==="tue"?"Tue moderate":"Fri primary"}, week ${sl.week}): ` +
        sl.sets.map(x=>`${x.name} ${x.secs!=null?x.secs+"s":x.weight+"×"+x.reps}`).join("; ") +
        ` — form check ${sl.formClean?"pass":"FAIL"}\n`;
    });
    md += `\n`;
  }
  md += `---\n_Generated by the offline Kinetic Chain Tracker (single HTML file, localStorage only)._\n`;
  download(`kinetic-tracker-report-${t}.md`, md, "text/markdown");
  markExported();
  toast("Markdown report downloaded ✓");
}
function importJSON(input){
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch(e){ toast("That file isn't valid JSON."); return; }
    if (!data || !data.program){ toast("That doesn't look like a tracker backup."); return; }
    data = migrate(data);
    window._pendingImport = data;
    const nDays = Object.keys(data.days||{}).length;
    showModal(`<h2>Import backup</h2>
      <p>Backup contains <b>${nDays}</b> logged days and <b>${(data.symptomChecks||[]).length}</b> morning checks, program week <b>${data.program.week}</b>.</p>
      <p class="dim"><b>Replace</b> wipes current data and restores the backup.<br>
      <b>Merge</b> keeps everything from both and prefers the more complete record for any day present in each.</p>
      <div class="yn"><button class="warn" onclick="applyImport('replace')">Replace</button>
      <button class="primary" onclick="applyImport('merge')">Merge</button></div>
      <button class="ghost big-btn" onclick="closeModal()">Cancel</button>`);
  };
  reader.readAsText(file);
  input.value = "";
}
function applyImport(mode){
  const data = window._pendingImport; if (!data) return;
  if (mode === "replace"){
    state = Object.assign(defaultState(), data, { activeSession: null });
  } else {
    Object.entries(data.days || {}).forEach(([date, day])=>{
      const mine = state.days[date];
      if (!mine){ state.days[date] = day; return; }
      // prefer whichever record holds more logged sets, then OR the flags
      const mineSets = Object.values(mine.work||{}).reduce((a,w)=>a+(w.sets||[]).length,0);
      const theirSets = Object.values(day.work||{}).reduce((a,w)=>a+(w.sets||[]).length,0);
      if (theirSets > mineSets) state.days[date] = Object.assign({}, mine, day);
      const m = state.days[date];
      m.mobilityComplete = mine.mobilityComplete || day.mobilityComplete;
      m.mtpComplete = mine.mtpComplete || day.mtpComplete;
      m.matchEndTime = mine.matchEndTime || day.matchEndTime;
      m.jog = mine.jog || day.jog;
    });
    const haveChecks = new Set(state.symptomChecks.map(c=>c.date));
    (data.symptomChecks||[]).forEach(c=>{ if (!haveChecks.has(c.date)) state.symptomChecks.push(c); });
    const haveLogs = new Set(state.logs.map(l=>l.id));
    (data.logs||[]).forEach(l=>{ if (!haveLogs.has(l.id)) state.logs.push(l); });
    if ((data.program.week||1) > state.program.week) state.program = data.program;
    if (data.lastExport && (!state.lastExport || data.lastExport > state.lastExport)) state.lastExport = data.lastExport;
  }
  state.symptomChecks.sort((a,b)=>a.date.localeCompare(b.date));
  window._pendingImport = null;
  save(); closeModal(); render();
  toast(mode === "replace" ? "Backup restored ✓" : "Backups merged ✓");
}

/* ===================== modal + toast ===================== */
function showModal(html, blocking){
  document.getElementById("modalhost").innerHTML =
    `<div class="modal-back" ${blocking ? "" : 'onclick="if(event.target===this)closeModal()"'}><div class="modal">${html}</div></div>`;
}
function closeModal(){ document.getElementById("modalhost").innerHTML = ""; }
let toastTimer = null;
function toast(msg){
  let el = document.getElementById("toast");
  if (!el){
    el = document.createElement("div"); el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#26313f;color:#e6edf3;padding:12px 18px;border-radius:12px;z-index:300;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.5);font-size:.95rem;";
    document.body.appendChild(el);
  }
  el.textContent = msg; el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display = "none"; }, 3500);
}

/* ===================== boot ===================== */
load();
rolloverWeek();
getDay(todayStr(), true);
save();
render();
if (state.activeSession) resumeSession();
else if (morningCheckDue()) askMorningCheck();
window.addEventListener("beforeunload", save);
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
